<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SOUR EMPIRE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0b1220;font-family:"Trebuchet MS",Verdana,system-ui,sans-serif;color:#fff;user-select:none}
canvas{display:block}
#app{position:fixed;inset:0}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.pe{pointer-events:auto}

/* ---------- top bar ---------- */
#topbar{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.chip{background:rgba(8,14,26,.86);border:2px solid #2b3f63;border-radius:12px;padding:6px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 0 #050a14}
.chip b{font-size:20px;letter-spacing:.5px}
.cash{color:#7cf08a;text-shadow:0 0 10px rgba(124,240,138,.35)}
.tok{color:#ffd166}
.cos{color:#c79bff}
.eng{color:#66e0ff}
.sub{font-size:11px;opacity:.72;font-weight:normal}
.iconbtn{width:42px;height:42px;border-radius:12px;background:rgba(8,14,26,.86);border:2px solid #2b3f63;color:#dfe9ff;font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 0 #050a14}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #050a14}
.iconbtn.alert{border-color:#ffcf5c;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 4px 0 #050a14,0 0 0 0 rgba(255,207,92,.6)}50%{box-shadow:0 4px 0 #050a14,0 0 0 9px rgba(255,207,92,0)}}
#rightrail{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}

/* ---------- bottom ---------- */
#bottom{position:absolute;bottom:10px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
#actionwrap{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}
#bigaction{min-width:240px;padding:16px 30px;border-radius:18px;border:3px solid #1f7a34;background:linear-gradient(#5ee07a,#27a844);color:#04240d;font-size:23px;font-weight:bold;letter-spacing:1px;cursor:pointer;box-shadow:0 6px 0 #10501f;text-shadow:0 1px 0 rgba(255,255,255,.4)}
#bigaction:active{transform:translateY(4px);box-shadow:0 2px 0 #10501f}
#bigaction.dim{filter:grayscale(.8) brightness(.7);cursor:default}
#hint{font-size:12px;opacity:.85;background:rgba(8,14,26,.7);padding:4px 12px;border-radius:10px;text-align:center;max-width:440px}
#joyzone{position:absolute;bottom:14px;left:14px;width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.16);display:none}
#joynub{position:absolute;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.28);left:38px;top:38px}

/* ---------- panels ---------- */
.panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(94vw,780px);max-height:84vh;background:linear-gradient(#101a2e,#0a1120);border:3px solid #33507f;border-radius:18px;display:none;flex-direction:column;box-shadow:0 18px 60px rgba(0,0,0,.7)}
.panel.open{display:flex}
.phead{padding:12px 16px;border-bottom:2px solid #24395e;display:flex;align-items:center;justify-content:space-between;gap:10px}
.phead h2{font-size:20px;letter-spacing:2px;text-transform:uppercase;color:#ffd97a}
.pbody{padding:12px 14px;overflow-y:auto;overflow-x:hidden}
.closeb{width:34px;height:34px;border-radius:10px;background:#b6263a;border:2px solid #7d1424;color:#fff;font-size:17px;cursor:pointer;flex:0 0 auto}
.tabs{display:flex;gap:6px;padding:8px 14px 0;flex-wrap:wrap}
.tab{padding:6px 12px;border-radius:10px 10px 0 0;background:#16233c;border:2px solid #24395e;border-bottom:none;font-size:12px;cursor:pointer;opacity:.65}
.tab.on{opacity:1;background:#22345a;color:#ffd97a}

.card{background:#15223a;border:2px solid #27406b;border-radius:12px;padding:10px 12px;margin-bottom:9px}
.card.locked{opacity:.5}
.card h3{font-size:15px;color:#e9f1ff;margin-bottom:2px}
.card .d{font-size:11.5px;opacity:.75;line-height:1.45}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.buy{padding:8px 14px;border-radius:10px;border:2px solid #1d6b8a;background:linear-gradient(#46c8e8,#1f93b6);color:#04212b;font-weight:bold;font-size:13px;cursor:pointer;box-shadow:0 4px 0 #0e4f66;white-space:nowrap}
.buy:active{transform:translateY(3px);box-shadow:0 1px 0 #0e4f66}
.buy.no{filter:grayscale(1) brightness(.65);cursor:default}
.buy.gold{border-color:#9a7314;background:linear-gradient(#ffd76a,#e0a92a);color:#2d1f00;box-shadow:0 4px 0 #7d5a0c}
.buy.pur{border-color:#6b3fa0;background:linear-gradient(#c79bff,#8b5cf6);color:#180a2e;box-shadow:0 4px 0 #4b2c7a}
.buy.red{border-color:#8a1d2b;background:linear-gradient(#ff7a7a,#d63d4e);color:#2b0409;box-shadow:0 4px 0 #6b1522}
.bar{height:9px;border-radius:6px;background:#0a1222;border:1px solid #27406b;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd166,#7cf08a);width:0%}
.tagline{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;opacity:.6;margin:12px 0 6px}
.pill{display:inline-block;font-size:10px;padding:2px 7px;border-radius:8px;background:#24395e;margin-left:6px;vertical-align:middle}
.pill.g{background:#1d5a32;color:#9cf0b0}
.pill.r{background:#5a1d28;color:#ffb3bd}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:9px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}

/* ---------- toasts / popups ---------- */
#toasts{position:absolute;top:74px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;width:min(92vw,520px)}
.toast{background:rgba(10,18,34,.94);border:2px solid #3a5race;border-radius:12px;padding:8px 16px;font-size:13px;text-align:center;animation:tin .28s ease}
@keyframes tin{from{transform:translateY(-14px) scale(.9);opacity:0}}
.toast.good{border-color:#2fa84f;color:#a8f5bb}
.toast.gold{border-color:#d8a22a;color:#ffe6a3}
.toast.bad{border-color:#b6263a;color:#ffb9c2}
.toast.void{border-color:#8b5cf6;color:#d9c2ff}

#floaters{position:absolute;inset:0;overflow:hidden}
.flo{position:absolute;font-weight:bold;font-size:18px;color:#8df59e;text-shadow:0 2px 4px #000;animation:fup 1.2s ease-out forwards}
@keyframes fup{to{transform:translateY(-70px);opacity:0}}

#banner{position:absolute;top:0;left:0;right:0;padding:10px;text-align:center;font-size:15px;letter-spacing:2px;text-transform:uppercase;display:none;background:linear-gradient(90deg,rgba(139,92,246,0),rgba(139,92,246,.85),rgba(139,92,246,0))}
#banner.on{display:block;animation:bslide .5s ease}
@keyframes bslide{from{transform:translateY(-40px)}}

/* ---------- phone ---------- */
#phone{position:absolute;right:12px;bottom:90px;width:min(90vw,300px);background:#0e1729;border:3px solid #3d5b8c;border-radius:18px;padding:12px;display:none;box-shadow:0 14px 40px rgba(0,0,0,.7)}
#phone.open{display:block}
#phone .who{font-size:13px;color:#ffd97a;margin-bottom:2px}
#phone .msg{font-size:12.5px;line-height:1.5;opacity:.92;margin-bottom:10px}
#phone .opts{display:flex;flex-direction:column;gap:6px}
#phone .opts button{padding:8px;border-radius:10px;font-size:12.5px;cursor:pointer;border:2px solid #27406b;background:#1b2b48;color:#dfe9ff}
#phone .opts button.acc{border-color:#1f7a34;background:#1d5a32}
#phone .opts button.neg{border-color:#9a7314;background:#5a4712}
#phone .timer{height:5px;background:#0a1222;border-radius:4px;margin-top:9px;overflow:hidden}
#phone .timer i{display:block;height:100%;background:#ffd166;width:100%}

/* ---------- minigames ---------- */
#mg{position:absolute;inset:0;background:rgba(4,8,16,.86);display:none;align-items:center;justify-content:center;z-index:20}
#mg.open{display:flex}
#mgbox{width:min(94vw,620px);background:#0e1729;border:3px solid #3d5b8c;border-radius:18px;padding:16px}
#track{background:#0a1222;border:2px solid #27406b;border-radius:12px;padding:8px;margin:10px 0}
.lane{height:30px;position:relative;margin:5px 0;background:linear-gradient(90deg,#131f36,#101a2e);border-radius:8px}
.lane .runner{position:absolute;top:2px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;transition:left .12s linear}
.lane .nm{position:absolute;right:6px;top:7px;font-size:11px;opacity:.7}
.lane.sel{outline:2px solid #ffd166}
#chart{width:100%;height:170px;background:#0a1222;border:2px solid #27406b;border-radius:12px;display:block}
.mgrow{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}

/* ---------- orchard plot detail ---------- */
.plot{background:#15223a;border:2px solid #27406b;border-radius:10px;padding:8px;font-size:11.5px}
.plot.empty{border-style:dashed;opacity:.7}
.plot .pn{font-size:12px;color:#ffd97a;margin-bottom:3px}
.mut{display:inline-block;font-size:9.5px;padding:1px 5px;border-radius:6px;background:#1d5a32;margin:1px}
.mut.bad{background:#5a1d28}

/* ---------- overlays ---------- */
#cine{position:absolute;inset:0;background:#000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:40;text-align:center;padding:24px}
#cine.open{display:flex}
#cine h1{font-size:min(9vw,44px);letter-spacing:4px}
#cine p{max-width:600px;font-size:14px;line-height:1.7;opacity:.85}
#cine button{margin-top:8px;padding:12px 26px;border-radius:14px;border:3px solid #1f7a34;background:linear-gradient(#5ee07a,#27a844);color:#04240d;font-size:16px;font-weight:bold;cursor:pointer}

#compass{position:absolute;top:58px;left:50%;transform:translateX(-50%);font-size:11.5px;background:rgba(8,14,26,.72);padding:4px 12px;border-radius:10px;opacity:.9;text-align:center;max-width:80vw}
#zonelbl{font-size:13px;color:#ffd97a;letter-spacing:2px}
#promptlbl{position:absolute;bottom:112px;left:50%;transform:translateX(-50%);background:rgba(8,14,26,.9);border:2px solid #ffd166;border-radius:12px;padding:8px 16px;font-size:13px;display:none;text-align:center;max-width:86vw}
#promptlbl.on{display:block}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#2b4270;border-radius:6px}
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <div id="banner"></div>
  <div id="topbar">
    <div class="chip"><span style="font-size:18px">💰</span><div><b class="cash" id="hCash">$0</b><div class="sub" id="hRate">$0 / sec</div></div></div>
    <div class="chip" id="cBackers" style="display:none"><span style="font-size:16px">👽</span><div><b style="font-size:16px;color:#b9f">0</b><div class="sub">Backers</div></div></div>
    <div class="chip" id="cTok" style="display:none"><span style="font-size:16px">🍃</span><div><b class="tok" style="font-size:16px">0</b><div class="sub">Grove Tokens</div></div></div>
    <div class="chip" id="cCos" style="display:none"><span style="font-size:16px">✦</span><div><b class="cos" style="font-size:16px">0</b><div class="sub">Cosmic</div></div></div>
    <div class="chip" id="cEng" style="display:none"><span style="font-size:16px">⚡</span><div><b class="eng" style="font-size:16px">0</b><div class="sub">World Charge</div></div></div>
  </div>
  <div id="rightrail">
    <div class="iconbtn pe" id="bMenu" title="Menu">☰</div>
    <div class="iconbtn pe" id="bManage" title="Empire (M)">📋</div>
    <div class="iconbtn pe" id="bPowers" title="Powers (P)">⚡</div>
    <div class="iconbtn pe" id="bGrove" title="The Grove (G)" style="display:none">🌳</div>
    <div class="iconbtn pe" id="bReset" title="Rebirth (R)" style="display:none">♻️</div>
    <div class="iconbtn pe" id="bMap" title="Travel (T)">🧭</div>
    <div class="iconbtn pe" id="bPhone" title="Phone">📱</div>
  </div>
  <div id="compass"><div id="zonelbl">HOME LOT</div><div id="objective">Walk to the Curb Stand and make your first sale.</div></div>
  <div id="toasts"></div>
  <div id="floaters"></div>
  <div id="promptlbl"></div>
  <div id="bottom">
    <div id="joyzone" class="pe"><div id="joynub"></div></div>
    <div id="actionwrap">
      <button id="bigaction" class="pe dim">— — —</button>
      <div id="hint">WASD / arrows to move · <b>E</b> to interact · <b>Space</b> to work</div>
    </div>
    <div style="width:132px"></div>
  </div>
  <div id="phone" class="pe">
    <div class="who" id="phWho">Unknown</div>
    <div class="msg" id="phMsg"></div>
    <div class="opts" id="phOpts"></div>
    <div class="timer"><i id="phTimer"></i></div>
  </div>
</div>

<div class="panel pe" id="pnl"><div class="phead"><h2 id="pnlTitle">Panel</h2><button class="closeb" onclick="UI.close()">✕</button></div><div class="tabs" id="pnlTabs"></div><div class="pbody" id="pnlBody"></div></div>

<div id="mg"><div id="mgbox"></div></div>
<div id="cine"><h1 id="cineT"></h1><p id="cineP"></p><button id="cineB">CONTINUE</button></div>

<!-- Three.js loads from a local copy first, so the game runs with no internet at
     all (a hard requirement for a desktop / Steam build). Drop the r128 build in
     as vendor/three.min.js next to this file. The CDN is only a fallback for the
     plain-browser version, and is never reached once the local file exists. -->
<script src="vendor/three.min.js" onerror="document.write('&lt;scr'+'ipt src=&quot;https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js&quot;&gt;&lt;/scr'+'ipt&gt;')"></script>
<script>
/* =========================================================================
   SOUR EMPIRE  —  a single-player 3D citrus tycoon / incremental
   Original work. Gameplay systems inspired by the idle-tycoon genre.
   ========================================================================= */
"use strict";

/* ---------------------------------------------------------------------
   BIG NUMBERS  (mantissa/exponent, handles 1e-300 .. 1e9e15)
   --------------------------------------------------------------------- */
function Big(m, e){ this.m = m; this.e = e; }
Big.prototype.norm = function(){
  if(!isFinite(this.m) || this.m === 0){ this.m = 0; this.e = 0; return this; }
  var s = this.m < 0 ? -1 : 1, a = Math.abs(this.m);
  var d = Math.floor(Math.log10(a));
  a = a / Math.pow(10, d);
  if(a >= 10){ a /= 10; d++; } if(a < 1){ a *= 10; d--; }
  this.m = s * a; this.e += d; return this;
};
function B(v, e){
  if(v instanceof Big) return new Big(v.m, v.e);
  if(e !== undefined) return new Big(v, e).norm();
  if(typeof v === "string"){ var p = parseFloat(v); return new Big(p,0).norm(); }
  if(!isFinite(v) || v === 0) return new Big(0,0);
  return new Big(v, 0).norm();
}
var B0 = function(){ return new Big(0,0); };
function bIsZero(a){ return a.m === 0; }
function bAdd(a,b){
  if(a.m===0) return B(b); if(b.m===0) return B(a);
  var hi=a,lo=b; if(b.e>a.e){hi=b;lo=a;}
  var d=hi.e-lo.e; if(d>17) return B(hi);
  return new Big(hi.m + lo.m/Math.pow(10,d), hi.e).norm();
}
function bSub(a,b){ return bAdd(a, new Big(-b.m, b.e)); }
function bMul(a,b){ if(a.m===0||b.m===0) return B0(); return new Big(a.m*b.m, a.e+b.e).norm(); }
function bDiv(a,b){ if(b.m===0||a.m===0) return B0(); return new Big(a.m/b.m, a.e-b.e).norm(); }
function bMulN(a,n){ if(a.m===0||n===0) return B0(); return new Big(a.m*n, a.e).norm(); }
function bDivN(a,n){ if(a.m===0||n===0) return B0(); return new Big(a.m/n, a.e).norm(); }
function bCmp(a,b){
  if(a.m===0&&b.m===0) return 0;
  if(a.m<=0&&b.m>0) return -1; if(a.m>0&&b.m<=0) return 1;
  if(a.e!==b.e) return (a.e<b.e)?-1:1;
  return a.m<b.m?-1:(a.m>b.m?1:0);
}
function bGte(a,b){ return bCmp(a,b)>=0; }
function bGt(a,b){ return bCmp(a,b)>0; }
function bLt(a,b){ return bCmp(a,b)<0; }
function bMax(a,b){ return bCmp(a,b)>=0?B(a):B(b); }
function bMin(a,b){ return bCmp(a,b)<=0?B(a):B(b); }
function bLog10(a){ if(a.m<=0) return -Infinity; return a.e + Math.log10(a.m); }
function bPowN(a,n){ // a^n, n real
  if(a.m<=0) return B0();
  var L = bLog10(a)*n; var e = Math.floor(L); return new Big(Math.pow(10, L-e), e).norm();
}
function bFromLog10(L){ if(!isFinite(L)) return B0(); var e=Math.floor(L); return new Big(Math.pow(10,L-e), e).norm(); }
function bToNum(a){ if(a.m===0) return 0; if(a.e>300) return Infinity; return a.m*Math.pow(10,a.e); }
function bSqrt(a){ return bPowN(a,0.5); }
function bRoot(a,n){ return bPowN(a,1/n); }

var UNITS = ["","K","M","B","T","Qa","Qi","Sx","Sp","Oc","No","Dc","UDc","DDc","TDc","QaDc","QiDc","SxDc","SpDc","OcDc","NoDc",
"Vg","UVg","DVg","TVg","QaVg","QiVg","SxVg","SpVg","OcVg","NoVg",
"Tg","UTg","DTg","TTg","QaTg","QiTg","SxTg","SpTg","OcTg","NoTg",
"Qd","UQd","DQd","TQd","QaQd","QiQd","SxQd","SpQd","OcQd","NoQd",
"Qq","UQq","DQq","TQq","QaQq","QiQq","SxQq","SpQq","OcQq","NoQq",
"Sg","USg","DSg","TSg","QaSg","QiSg","SxSg","SpSg","OcSg","NoSg",
"St","USt","DSt","TSt","QaSt","QiSt","SxSt","SpSt","OcSt","NoSt",
"Og","UOg","DOg","TOg","QaOg","QiOg","SxOg","SpOg","OcOg","NoOg",
"Nn","UNn","DNn","TNn","QaNn","QiNn","SxNn","SpNn","OcNn","NoNn","Ce"];
var LONGNAMES=["","Thousand","Million","Billion","Trillion","Quadrillion","Quintillion","Sextillion","Septillion","Octillion","Nonillion","Decillion"];
function fmt(a, dec){
  if(typeof a === "number") a = B(a);
  if(a.m === 0) return "0";
  var neg = a.m<0; if(neg) a = new Big(-a.m,a.e);
  if(a.e < 0) return (neg?"-":"") + bToNum(a).toFixed(2);
  if(a.e < 3){ var n = bToNum(a); return (neg?"-":"") + (n<10 ? n.toFixed(dec===undefined?(n<1?2:1):dec) : Math.floor(n).toLocaleString()); }
  var gi = Math.floor(a.e/3), rem = a.e - gi*3;
  var mant = a.m*Math.pow(10,rem);
  if(ST && ST.settings && ST.settings.sciNotation) return (neg?"-":"")+a.m.toFixed(3)+"e"+a.e;
  if(gi < UNITS.length) return (neg?"-":"") + mant.toFixed(mant<100?2:1) + UNITS[gi];
  return (neg?"-":"") + a.m.toFixed(3)+"e"+a.e;
}
function fmtC(a){ return "$"+fmt(a); }
function fmtInt(n){ return Math.floor(n).toLocaleString(); }
function fmtTime(s){
  s = Math.max(0, Math.floor(s));
  if(s<60) return s+"s";
  if(s<3600) return Math.floor(s/60)+"m "+(s%60)+"s";
  if(s<86400) return Math.floor(s/3600)+"h "+Math.floor((s%3600)/60)+"m";
  return Math.floor(s/86400)+"d "+Math.floor((s%86400)/3600)+"h";
}
function ratioText(cost, have){
  if(bIsZero(cost)) return "";
  if(bGte(have,cost)) return "";
  var r = bDiv(cost, bMax(have,B(1)));
  return "×"+fmt(r)+" your cash";
}
/* =====================  GAME DATA  ===================== */

var FRUITS = [
 {id:0,name:"Common Zest",   col:0xf2d43b, glow:0},
 {id:1,name:"Amberpeel",     col:0xff9f2e, glow:0},
 {id:2,name:"Glasslime",     col:0x9ef03a, glow:0},
 {id:3,name:"Bittercrown",   col:0xff5f7a, glow:0},
 {id:4,name:"Emberfruit",    col:0xff6a1f, glow:1},
 {id:5,name:"Duskpomel",     col:0xc86bff, glow:1},
 {id:6,name:"Abysszest",     col:0x2ad0c0, glow:1},
 {id:7,name:"Nullrind",      col:0x6a7bff, glow:2},
 {id:8,name:"Voidfruit",     col:0x8b5cf6, glow:2},
 {id:9,name:"Puritas",       col:0xffffff, glow:3}
];
var EVO_SPEED = 42;               // production speed multiplier per Descent

/* ---- serialization: Big -> [m,e] ---- */
function enc(o){
  if(o instanceof Big) return {__b:[o.m,o.e]};
  if(Array.isArray(o)) return o.map(enc);
  if(o && typeof o === "object"){ var r={}; for(var k in o) r[k]=enc(o[k]); return r; }
  return o;
}
function dec(o){
  if(o && typeof o === "object"){
    if(o.__b) return new Big(o.__b[0], o.__b[1]);
    if(Array.isArray(o)) return o.map(dec);
    var r={}; for(var k in o) r[k]=dec(o[k]); return r;
  }
  return o;
}
function save(){
  try{ ST.t = Date.now(); localStorage.setItem(SAVEKEY, JSON.stringify(enc(ST))); }catch(e){}
}
function load(){
  try{
    var raw = localStorage.getItem(SAVEKEY);
    if(!raw) return null;
    var s = dec(JSON.parse(raw));
    var base = newState();
    for(var k in base) if(s[k]===undefined) s[k]=base[k];
    for(var k2 in base.settings) if(s.settings[k2]===undefined) s.settings[k2]=base.settings[k2];
    // repair source array length
    while(s.src.length < SOURCES.length) s.src.push(newSource(s.src.length));
    for(var i=0;i<SOURCES.length;i++){
      if(!s.src[i].lv) s.src[i].lv=[];
      while(s.src[i].lv.length < SOURCES[i].ups.length) s.src[i].lv.push(0);
    }
    return s;
  }catch(e){ console.warn("load fail",e); return null; }
}

/* =====================  ECONOMY MATH  ===================== */
function hasPower(k,lv){ return (ST.powers[k]||0) >= (lv||1); }
function cshop(k){ return ST.cosmicShop[k]||0; }

function evoSpeedMult(){ return Math.pow(EVO_SPEED, ST.evo); }
function backerMult(){
  var per = ST.secrets.samaritan ? 0.02 : 0.01;
  return 1 + ST.backers*per;
}
function ascCashMult(){ return Math.pow(7.77, ST.asc); }
function ascPriceMult(){ return Math.pow(3.33, ST.asc); }
function chargeMult(){ return 1 + 9*Math.min(1, ST.charge/30000); }
function spireGlobal(){
  var m=1; for(var i=0;i<ST.spire;i++){ var s=SPIRE[i]; if(s.t==="gmult") m*=s.v; } return m;
}
function spireSpeed(){ var m=1; for(var i=0;i<ST.spire;i++){ var s=SPIRE[i]; if(s.t==="speed") m*=s.v; } return m; }
function spireSrc(id){ var m=1; for(var i=0;i<ST.spire;i++){ var s=SPIRE[i]; if(s.t==="smult"&&s.s===id) m*=s.v; } return m; }
function spirePickup(){ var m=1; for(var i=0;i<ST.spire;i++){ var s=SPIRE[i]; if(s.t==="pickup") m*=s.v; } return m; }
function spireBacker(){ var m=1; for(var i=0;i<ST.spire;i++){ var s=SPIRE[i]; if(s.t==="backer") m*=s.v; } return m; }
function gatewayGlobal(){
  var m=1; var v=[1.6,2,1,1,4,1,1,1];
  for(var i=0;i<ST.gateway;i++) m*=v[i]; return m;
}
function gatewaySpeed(){ return ST.gateway>=3?1.5:1; }
function gatewayPickup(){ return ST.gateway>=4?3:1; }

function groveBuffMult(kind){
  var m=1, now=nowS();
  for(var i=0;i<ST.grove.buffs.length;i++){ var b=ST.grove.buffs[i]; if(b.until>now && b[kind]) m*=b[kind]; }
  return m;
}
function weatherMult(){ var w=weatherDef(); return w.mult; }
function weatherDef(){ for(var i=0;i<WEATHERS.length;i++) if(WEATHERS[i].k===ST.weather) return WEATHERS[i]; return WEATHERS[0]; }

function globalCashMult(){
  var m = backerMult() * ascCashMult() * chargeMult() * spireGlobal() * gatewayGlobal()
        * weatherMult() * groveBuffMult("cash");
  // per-source "global" doctrine upgrades
  for(var i=0;i<SOURCES.length;i++){
    var ups = SOURCES[i].ups;
    for(var j=0;j<ups.length;j++) if(ups[j].kind==="global" && ST.src[i].lv[j]>0) m *= Math.pow(ups[j].val, ST.src[i].lv[j]);
  }
  if(ST.invasion.active) m *= invasionMult();
  return m;
}
function globalSpeedMult(){
  var m = evoSpeedMult() * spireSpeed() * gatewaySpeed() * groveBuffMult("spd");
  if(hasPower("dilate")) m *= 2;
  return m;
}

/* per-source payout / cycle */
function srcPayout(i){
  var S=SOURCES[i], s=ST.src[i];
  var p = B(S.base);
  for(var j=0;j<S.ups.length;j++){
    var u=S.ups[j], lv=s.lv[j];
    if(lv>0 && u.kind==="cash") p = bMul(p, bPowN(B(u.val), lv));
  }
  p = bMulN(p, spireSrc(i));
  p = bMulN(p, globalCashMult());
  return p;
}
function srcCycle(i){
  var S=SOURCES[i], s=ST.src[i], c=S.cycle;
  for(var j=0;j<S.ups.length;j++){
    var u=S.ups[j], lv=s.lv[j];
    if(lv>0 && u.kind==="speed") c /= Math.pow(u.val, lv);
  }
  c /= globalSpeedMult();
  return Math.max(1e-12, c);
}
function srcRate(i){ if(!ST.src[i].owned||!ST.src[i].mgr) return B0(); return bDivN(srcPayout(i), srcCycle(i)); }
function totalRate(){ var t=B0(); for(var i=0;i<SOURCES.length;i++) t=bAdd(t, srcRate(i)); return t; }
function totalRateIncludingManual(){
  var t=B0();
  for(var i=0;i<SOURCES.length;i++){ if(!ST.src[i].owned) continue; t=bAdd(t, bDivN(srcPayout(i), srcCycle(i))); }
  return t;
}

/* upgrade cost with level scaling + ascension price penalty */
function upCost(i,j,lv){
  var u = SOURCES[i].ups[j];
  var c = B(u.cost);
  c = bMulN(c, ascPriceMult());
  return c;
}
function maxLevel(u){ return 1; }
function bulkAmount(){ return 1; }
function canBuyAll(){ return (ST.powers.bulk||0) > 0; }
function buyAllRange(){ var lv=ST.powers.bulk||0; return [0,3,8,20,999][lv]; }
function srcUnlockCost(i){ return bMulN(B(SOURCES[i].unlock), ascPriceMult()); }

/* backers from rebirth */
function backersFromRebirth(){
  var e = ST.earnedRun;
  if(bLt(e, B(1e18))) return 0;
  var L = bLog10(e) - 18;
  var n = 12 * Math.pow(10, L*0.68);
  n *= spireBacker();
  n *= (1 + 0.25*cshop("backer"));
  return Math.floor(n);
}
function canRebirth(){ return bGte(ST.earnedRun, B(1e18)); }
function nextEvoReq(){ return ST.evo>=9 ? EVO_REQ[9]*Math.pow(60, ST.evo-8) : EVO_REQ[ST.evo+1]; }
function canEvolve(){ return ST.backers >= nextEvoReq(); }
function canAscend(){ return ST.spire >= SPIRE.length; }

/* Distance is measured to the NEAREST of the building and its own two
   pads, not to the building alone. Every district is laid out around a
   forecourt now, so a pad can legitimately stand well clear of the
   structure it belongs to -- and a player standing ON the upgrade pad,
   having just walked to it, should never be told to walk to the
   business. Standing on a business's own pad always counts as being
   at that business. */
function nearSource(i){
  if(ST.zone!=="home") return false;
  var p = W.player ? W.player.position : {x:0,z:0};
  var best = Math.hypot(p.x-SOURCES[i].pos[0], p.z-SOURCES[i].pos[2]);
  var b = (typeof BUILDINGS!=="undefined") && BUILDINGS[i];
  if(b){
    if(b.work) best = Math.min(best, Math.hypot(p.x-b.work.x, p.z-b.work.z));
    if(b.shop) best = Math.min(best, Math.hypot(p.x-b.shop.x, p.z-b.shop.z));
  }
  return best < 18;
}
function canManageNow(i){
  if(hasPower("reach")) return true;
  if(ST.zone!=="home") return false;
  return hasPower("oversight") || nearSource(i);
}
function nowS(){ return Date.now()/1000; }

var W = {scene:null,cam:null,rend:null,player:null,clock:null,zoneGroups:{},labels:[],pickups:[],
         camYaw:0.0, camDist:22, camHeight:12, keys:{}, joy:{x:0,y:0,on:false}, interacts:[], fxParts:[],
         sunLight:null, hemi:null, sky:null, playerVel:new THREE.Vector3(), bob:0};

function mkLabelTex(lines, w, h, bg, fg){
  var c = document.createElement("canvas"); c.width=w; c.height=h;
  var x = c.getContext("2d");
  x.fillStyle = bg||"rgba(8,14,26,0.92)"; roundRect(x,3,3,w-6,h-6,18); x.fill();
  x.strokeStyle = fg||"#ffd166"; x.lineWidth=5; roundRect(x,3,3,w-6,h-6,18); x.stroke();
  x.textAlign="center"; x.textBaseline="middle";
  var n = lines.length, lh = h/(n+0.6);
  for(var i=0;i<n;i++){
    var L = lines[i];
    x.fillStyle = L.c||"#ffffff";
    x.font = "bold "+(L.s||34)+"px Trebuchet MS, Verdana, sans-serif";
    x.fillText(L.t, w/2, lh*(i+0.9));
  }
  var t = new THREE.CanvasTexture(c); t.needsUpdate=true; return t;
}
function roundRect(x,a,b,w,h,r){ x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+w,b,a+w,b+h,r); x.arcTo(a+w,b+h,a,b+h,r); x.arcTo(a,b+h,a,b,r); x.arcTo(a,b,a+w,b,r); x.closePath(); }

function makeSign(lines, scale, w, h, bg, fg){
  var tex = mkLabelTex(lines, w||512, h||160, bg, fg);
  var m = new THREE.SpriteMaterial({map:tex, depthTest:true, transparent:true});
  var sp = new THREE.Sprite(m);
  sp.scale.set((scale||6), (scale||6)*( (h||160)/(w||512) ), 1);
  sp.userData.setLines = function(ls,bg2,fg2){
    sp.material.map.dispose();
    sp.material.map = mkLabelTex(ls, w||512, h||160, bg2||bg, fg2||fg);
    sp.material.needsUpdate = true;
  };
  return sp;
}

/* ---------------------------------------------------------------
   PAINTED SIGNAGE

   Lettering painted straight onto a board, rather than a floating
   sprite. Signs are how a district names itself from across the map,
   so every business gets one and the UI label above the pad is only
   ever a confirmation of something already readable in the world.
--------------------------------------------------------------- */
function signTexture(text, w, h, bg, fg, stripe){
  var c = document.createElement("canvas"); c.width=w; c.height=h;
  var x = c.getContext("2d");
  x.fillStyle = bg; x.fillRect(0,0,w,h);
  if(stripe){ x.fillStyle = stripe; x.fillRect(0,h*0.86,w,h*0.14); x.fillRect(0,0,w,h*0.05); }
  x.textAlign="center"; x.textBaseline="middle";
  var lines = String(text).split("\n");
  var size = Math.min(h/(lines.length*1.5), w/(Math.max.apply(null, lines.map(function(l){return l.length;}))*0.62));
  x.font = "bold "+Math.floor(size)+"px Trebuchet MS, Verdana, sans-serif";
  x.fillStyle = fg;
  for(var i=0;i<lines.length;i++) x.fillText(lines[i], w/2, h*(0.44) + (i - (lines.length-1)/2)*size*1.18);
  var t = new THREE.CanvasTexture(c); t.needsUpdate = true;
  t.anisotropy = 4;
  return t;
}

/* ---------------------------------------------------------------
   ASSET CACHE

   This is a browser game, so the single most valuable thing the
   world builder can do is stop allocating. Every geometry and every
   material is created once and handed out by key: a town with two
   thousand objects in it ends up holding a few dozen geometries and
   a few dozen materials rather than four thousand of each.

   box()/cyl()/sph() keep their original behaviour -- a fresh
   material each time -- because gameplay code elsewhere recolours
   individual meshes and would otherwise repaint half the map. The
   shared-material variants below (bx/cy/sp) are what the scenery
   uses, where nothing is ever recoloured in isolation.
--------------------------------------------------------------- */
var GEO = {}, MAT = {};

function gBox(w,h,d){
  var k = "b"+w.toFixed(3)+"_"+h.toFixed(3)+"_"+d.toFixed(3);
  return GEO[k] || (GEO[k] = new THREE.BoxGeometry(w,h,d));
}
function gCyl(r1,r2,h,seg){
  seg = seg||12;
  var k = "c"+r1.toFixed(3)+"_"+r2.toFixed(3)+"_"+h.toFixed(3)+"_"+seg;
  return GEO[k] || (GEO[k] = new THREE.CylinderGeometry(r1,r2,h,seg));
}
function gSph(r,seg){
  seg = seg||12;
  var k = "s"+r.toFixed(3)+"_"+seg;
  return GEO[k] || (GEO[k] = new THREE.SphereGeometry(r,seg,Math.max(6,seg*0.7|0)));
}
function gCone(r,h,seg){
  var k = "n"+r.toFixed(3)+"_"+h.toFixed(3)+"_"+(seg||12);
  return GEO[k] || (GEO[k] = new THREE.ConeGeometry(r,h,seg||12));
}
function gTorus(r,t,seg){
  var k = "t"+r.toFixed(3)+"_"+t.toFixed(3)+"_"+(seg||24);
  return GEO[k] || (GEO[k] = new THREE.TorusGeometry(r,t,8,seg||24));
}
function gPlane(w,h){
  var k = "p"+w.toFixed(2)+"_"+h.toFixed(2);
  return GEO[k] || (GEO[k] = new THREE.PlaneGeometry(w,h));
}

/* Materials. `o` may carry transparency, opacity, emissive and shine. */
function mat(col,o){
  o = o || {};
  var k = "m"+col+"_"+(o.op||1)+"_"+(o.em||0)+"_"+(o.shine?1:0)+"_"+(o.flat?1:0);
  if(MAT[k]) return MAT[k];
  var m;
  if(o.shine){
    m = new THREE.MeshPhongMaterial({color:col, shininess:o.shine, specular:o.spec||0x333333, flatShading:!!o.flat});
  } else {
    m = new THREE.MeshLambertMaterial({color:col, flatShading:!!o.flat});
  }
  if(o.op!==undefined && o.op<1){ m.transparent=true; m.opacity=o.op; }
  if(o.em) m.emissive = new THREE.Color(col).multiplyScalar(o.em);
  if(o.side) m.side = o.side;
  MAT[k] = m; return m;
}
/* Surface presets, so a wall is never accidentally as glossy as glass. */
function matRough(col){ return mat(col,{shine:2,spec:0x0a0a0a}); }
function matStone(col){ return mat(col,{shine:6,spec:0x111111}); }
function matMetal(col){ return mat(col,{shine:60,spec:0x777777}); }
function matGlass(col,op){ return mat(col,{shine:110,spec:0xbbbbbb,op:op===undefined?0.45:op}); }
function matGlow(col,em){ return mat(col,{em:em===undefined?0.6:em}); }

/* ---------- original primitives (unique material, unchanged API) ---------- */
function box(w,h,d,col,x,y,z,rot){
  var m = new THREE.Mesh(gBox(w,h,d), new THREE.MeshLambertMaterial({color:col}));
  m.position.set(x,y,z); if(rot) m.rotation.y=rot; m.castShadow=true; m.receiveShadow=true; return m;
}
function cyl(r1,r2,h,col,x,y,z,seg){
  var m = new THREE.Mesh(gCyl(r1,r2,h,seg||12), new THREE.MeshLambertMaterial({color:col}));
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; return m;
}
function sph(r,col,x,y,z){
  var m = new THREE.Mesh(gSph(r,14), new THREE.MeshLambertMaterial({color:col}));
  m.position.set(x,y,z); m.castShadow=true; return m;
}

/* ---------- shared-material scenery primitives ---------- */
function bx(p,w,h,d,material,x,y,z,ry){
  var m = new THREE.Mesh(gBox(w,h,d), material);
  m.position.set(x,y,z); if(ry) m.rotation.y=ry;
  m.castShadow=true; m.receiveShadow=true;
  if(p) p.add(m);
  return m;
}
function cy(p,r1,r2,h,material,x,y,z,seg){
  var m = new THREE.Mesh(gCyl(r1,r2,h,seg||10), material);
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true;
  if(p) p.add(m);
  return m;
}
function sp(p,r,material,x,y,z,seg){
  var m = new THREE.Mesh(gSph(r,seg||10), material);
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true;
  if(p) p.add(m);
  return m;
}
function cn(p,r,h,material,x,y,z,seg){
  var m = new THREE.Mesh(gCone(r,h,seg||10), material);
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true;
  if(p) p.add(m);
  return m;
}
/* A flat quad laid on the ground. Used for every painted marking, so
   road lines and forecourt bays cost one flat plane instead of a slab
   that would z-fight with the tarmac under it. */
function decal(p,w,d,material,x,y,z,ry){
  var m = new THREE.Mesh(gPlane(w,d), material);
  m.rotation.x = -Math.PI/2; if(ry) m.rotation.z = ry;
  m.position.set(x,y,z);
  m.receiveShadow = true;
  if(p) p.add(m);
  return m;
}
/* decal(), but instanced. Road dashes, bay lines, expansion joints and
   paving flags are the highest-count objects in the map by a wide
   margin; routing them through one shared unit plane turns a few
   hundred draw calls into a handful. */
function idec(zone,w,d,material,x,y,z,ry){
  inst(zone, gPlane(1,1), material, x, y, z, 0, w, d, 1, -Math.PI/2, ry||0);
}

/* A board with lettering painted on the front face. */
function plaque(p,text,w,h,x,y,z,ry,bg,fg,stripe){
  var g = new THREE.Group();
  var body = bx(g, w, h, 0.34, matRough(bg), 0,0,0);
  var face = new THREE.Mesh(gPlane(w*0.96,h*0.86),
    new THREE.MeshBasicMaterial({map:signTexture(text, 512, Math.max(96, 512*h/w|0), "#"+("000000"+bg.toString(16)).slice(-6), "#"+("000000"+fg.toString(16)).slice(-6), stripe)}));
  face.position.z = 0.19; g.add(face);
  var back = face.clone(); back.position.z = -0.19; back.rotation.y = Math.PI; g.add(back);
  g.position.set(x,y,z); if(ry) g.rotation.y = ry;
  if(p) p.add(g);
  return g;
}

/* ---------------------------------------------------------------
   INSTANCING

   Vegetation, fence pickets, road markings, crates, windows: the
   repetitive half of a map is most of its object count and almost
   none of its interest. Anything repeated goes through inst() and
   comes out the other side as one InstancedMesh per geometry and
   material, which is the difference between a town that runs and a
   town that stutters on a laptop.
--------------------------------------------------------------- */
var INST = {};
var _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _v = new THREE.Vector3(), _s = new THREE.Vector3();

function inst(zone, geo, material, x,y,z, ry, sx,sy,sz, rx,rz){
  var key = zone+"|"+geo.uuid+"|"+material.uuid;
  var b = INST[key] || (INST[key] = {zone:zone, geo:geo, mat:material, list:[]});
  _e.set(rx||0, ry||0, rz||0);
  _q.setFromEuler(_e);
  _v.set(x,y,z);
  _s.set(sx===undefined?1:sx, sy===undefined?1:sy, sz===undefined?1:sz);
  b.list.push(new THREE.Matrix4().compose(_v,_q,_s));
}
function flushInstances(){
  for(var k in INST){
    var b = INST[k];
    if(!b.list.length) continue;
    var im = new THREE.InstancedMesh(b.geo, b.mat, b.list.length);
    for(var i=0;i<b.list.length;i++) im.setMatrixAt(i, b.list[i]);
    im.instanceMatrix.needsUpdate = true;
    im.castShadow = true; im.receiveShadow = true;
    /* An InstancedMesh takes its bounding sphere from the base geometry,
       so a forest spread over 300 units would be culled the moment the
       origin left the frustum. */
    im.frustumCulled = false;
    W.zoneGroups[b.zone].add(im);
  }
  INST = {};
}

/* Deterministic noise, so the map is hand-placed in effect: it looks
   scattered, but it is the same scatter every single load. */
function mkRng(seed){
  var s = (seed>>>0) || 1;
  return function(){ s = (s*1664525 + 1013904223)>>>0; return s/4294967296; };
}
function pick(rnd, arr){ return arr[Math.min(arr.length-1, (rnd()*arr.length)|0)]; }

  concrete:0xaeaca4, concreteDim:0x8e8c85,
  wood:0x8a5f2a, woodDark:0x6b4a2f, woodPale:0xc49a68,
  plaster:0xf0e8d6, plasterWarm:0xe6ceaa,
  brick:0xb0604a, roofTile:0x9c4a3a, roofSlate:0x4a5060,

/* ---------------------------------------------------------------
   VEGETATION

   Three canopy sizes, five leaf colours, three barks, random lean,
   random rotation, two or three offset masses per tree. Nothing is
   ever placed on a grid and nothing is ever the same twice, which is
   the whole difference between a planted landscape and a copy-paste.
--------------------------------------------------------------- */
function treeAt(zone, x, z, scale, rnd, y){
  var s = (scale||1) * (0.78 + rnd()*0.5);
  var base = y||0;
  var th = 7*s;
  var bark = matRough(pick(rnd,P.bark));
  var lean = (rnd()-0.5)*0.16;
  /* One unit trunk geometry, scaled per tree. Baking the height into the
     geometry gave every single tree its own buffer and its own draw
     call, which is the opposite of what instancing is for. */
  inst(zone, gCyl(0.73,1,1,7), bark, x, base+th/2, z, rnd()*6.28, 0.75*s, th, 0.75*s, lean, lean*0.6);

  var masses = 2 + (rnd()<0.55?1:0);
  for(var i=0;i<masses;i++){
    var leaf = matRough(pick(rnd,P.leaf));
    var spread = i===0 ? 0 : (1.2+rnd()*2.4)*s;
    var a = rnd()*6.28;
    var r = (i===0 ? 3.9 : 2.4+rnd()*1.3) * s;
    inst(zone, gSph(1,9), leaf,
      x + Math.cos(a)*spread,
      base + th + (i===0 ? 1.6 : 0.4+rnd()*2.6)*s,
      z + Math.sin(a)*spread,
      rnd()*6.28,
      r, r*(0.72+rnd()*0.26), r*(0.86+rnd()*0.24));
  }
}
function bushAt(zone,x,z,scale,rnd,y){
  var s = (scale||1)*(0.8+rnd()*0.5), base=y||0;
  for(var i=0;i<2+(rnd()<0.5?1:0);i++){
    var a = rnd()*6.28, sp2 = i===0?0:(0.5+rnd()*1.1)*s, r=(1.1+rnd()*0.7)*s;
    inst(zone, gSph(1,8), matRough(pick(rnd,P.leaf)),
      x+Math.cos(a)*sp2, base+r*0.72, z+Math.sin(a)*sp2, rnd()*6.28, r, r*0.78, r);
  }
}
function rockAt(zone,x,z,scale,rnd,y){
  var s=(scale||1)*(0.7+rnd()*0.8), base=y||0;
  var shade = 0.86+rnd()*0.2;
  var col = (Math.min(255,0x8e*shade)<<16)|(Math.min(255,0x8c*shade)<<8)|Math.min(255,0x85*shade);
  inst(zone, gSph(1,7), matStone(col), x, base+0.55*s, z, rnd()*6.28,
    1.5*s, 1.0*s, 1.25*s, (rnd()-0.5)*0.4, (rnd()-0.5)*0.4);
}
/* A planted bed: dark soil inside a low kerb, with flowers standing in it. */
function flowerBed(zone,parent,x,z,w,d,rnd,y){
  var base = y||0;
  decal(parent, w, d, matRough(P.soilDark), x, base+0.08, z);
  var kerbM = matStone(P.kerb);
  inst(zone, gBox(w+0.8,0.7,0.4), kerbM, x, base+0.35, z-d/2);
  inst(zone, gBox(w+0.8,0.7,0.4), kerbM, x, base+0.35, z+d/2);
  inst(zone, gBox(0.4,0.7,d), kerbM, x-w/2, base+0.35, z);
  inst(zone, gBox(0.4,0.7,d), kerbM, x+w/2, base+0.35, z);
  var n = Math.max(3, (w*d/7)|0);
  for(var i=0;i<n;i++){
    var fx = x + (rnd()-0.5)*(w-1.4), fz = z + (rnd()-0.5)*(d-1.4);
    inst(zone, gCyl(0.07,0.07,0.9,5), matRough(P.leaf[2]), fx, base+0.55, fz);
    inst(zone, gSph(1,6), matRough(pick(rnd,P.flower)), fx, base+1.1, fz, rnd()*6.28, 0.28,0.22,0.28);
  }
}
/* Trimmed hedging, used to frame entrances rather than to fill space. */
function hedgeRun(zone,x1,z1,x2,z2,rnd,h,y){
  var dx=x2-x1, dz=z2-z1, len=Math.hypot(dx,dz);
  if(len<0.5) return;
  var steps = Math.max(1, (len/2.6)|0), ry = Math.atan2(dx,dz), base=y||0;
  for(var i=0;i<=steps;i++){
    var t=i/steps, hh=(h||2.4)*(0.88+rnd()*0.24);
    inst(zone, gBox(2.4,1,2.4), matRough(pick(rnd,P.leaf)),
      x1+dx*t, base+hh/2, z1+dz*t, ry+(rnd()-0.5)*0.12, 1, hh, 1);
  }
}
/* Fences. `style` is picket, rail or chain. */
function fenceRun(zone,x1,z1,x2,z2,style,rnd,y){
  var dx=x2-x1, dz=z2-z1, len=Math.hypot(dx,dz);
  if(len<0.5) return;
  var ry = Math.atan2(dx,dz), base=y||0;
  var mx=(x1+x2)/2, mz=(z1+z2)/2;
  if(style==="chain"){
    var mesh = matMetal(P.steel);
    var panel = new THREE.Mesh(gBox(0.08,3.6,len), mat(P.steel,{op:0.34,shine:40}));
    panel.position.set(mx, base+1.8, mz); panel.rotation.y=ry; panel.receiveShadow=true;
    W.zoneGroups[zone].add(panel);
    inst(zone, gBox(0.16,0.16,len), mesh, mx, base+3.6, mz, ry);
    var n = Math.max(2,(len/7)|0);
    for(var i=0;i<=n;i++) inst(zone, gCyl(0.16,0.16,3.8,6), matMetal(P.steelDark), x1+dx*i/n, base+1.9, z1+dz*i/n);
    return;
  }
  if(style==="rail"){
    var railM = matRough(P.woodPale);
    inst(zone, gBox(0.22,0.28,len), railM, mx, base+1.05, mz, ry);
    inst(zone, gBox(0.22,0.28,len), railM, mx, base+1.95, mz, ry);
    var m2 = Math.max(2,(len/5.5)|0);
    for(var j=0;j<=m2;j++) inst(zone, gBox(0.42,2.4,0.42), matRough(P.wood), x1+dx*j/m2, base+1.2, z1+dz*j/m2, ry);
    return;
  }
  var pk = matRough(P.plaster);
  var count = Math.max(2,(len/0.85)|0);
  for(var k=0;k<=count;k++){
    inst(zone, gBox(0.34,1.8,0.16), pk, x1+dx*k/count, base+0.9, z1+dz*k/count, ry+(rnd?(rnd()-0.5)*0.06:0));
  }
  inst(zone, gBox(0.18,0.22,len), pk, mx, base+1.45, mz, ry);
  inst(zone, gBox(0.18,0.22,len), pk, mx, base+0.62, mz, ry);
}

/* ---------------------------------------------------------------
   STREET FURNITURE
--------------------------------------------------------------- */
function streetLamp(zone,parent,x,z,ry,h,lit){
  h = h||7;
  var dark = matMetal(P.steelDark);
  inst(zone, gCyl(0.85,0.95,0.3,8), matStone(P.concreteDim), x, 0.15, z);
  inst(zone, gCyl(0.22,0.26,h,7), dark, x, h/2, z);
  var ax = Math.sin(ry)*1.1, az = Math.cos(ry)*1.1;
  inst(zone, gBox(0.2,0.2,2.4), dark, x+ax, h, z+az, ry);
  inst(zone, gBox(1.2,0.32,0.7), dark, x+ax*2, h-0.16, z+az*2, ry);
  inst(zone, gBox(1.0,0.16,0.5), matGlow(0xfff0c8,0.9), x+ax*2, h-0.36, z+az*2, ry);
  if(lit && parent){
    var pl = new THREE.PointLight(0xffe9b8, 0.5, 26, 2);
    pl.position.set(x+ax*2, h-0.6, z+az*2);
    parent.add(pl);
  }
}
function bench(zone,x,z,ry){
  var legs = matMetal(P.steelDark), seat = matRough(P.wood);
  var ox = Math.cos(ry)*1.5, oz = -Math.sin(ry)*1.5;
  inst(zone, gBox(0.22,0.9,1.1), legs, x+ox, 0.45, z+oz, ry);
  inst(zone, gBox(0.22,0.9,1.1), legs, x-ox, 0.45, z-oz, ry);
  inst(zone, gBox(3.6,0.18,1.2), seat, x, 0.96, z, ry);
  inst(zone, gBox(3.6,0.9,0.18), seat, x-Math.sin(ry)*0.5, 1.45, z-Math.cos(ry)*0.5, ry);
}
function litterBin(zone,x,z){
  inst(zone, gCyl(0.55,0.45,1.5,9), matMetal(P.steelDark), x, 0.75, z);
  inst(zone, gCyl(0.62,0.62,0.14,9), matMetal(P.steel), x, 1.56, z);
}
function bollard(zone,x,z){ inst(zone, gCyl(0.2,0.24,1.3,7), matMetal(P.steelWarn), x, 0.65, z); }
function trafficCone(zone,x,z,rnd){
  inst(zone, gBox(0.8,0.1,0.8), matRough(0xe2603a), x, 0.06, z, rnd?rnd()*6.28:0);
  inst(zone, gCone(0.3,1.1,7), matRough(0xe2603a), x, 0.6, z);
}
/* A sign on legs, which is how every district announces itself. */
function postSign(zone,parent,text,x,z,w,h,ry,bg,fg){
  var legs = matMetal(P.steelDark);
  var pairs = w>5 ? [-w/3, w/3] : [0];
  for(var i=0;i<pairs.length;i++){
    inst(zone, gCyl(0.16,0.16,h,6), legs, x+Math.cos(ry)*pairs[i], h/2, z-Math.sin(ry)*pairs[i]);
  }
  plaque(parent, text, w, w*0.3, x, h + w*0.15, z, ry, bg, fg);
}

/* ---------------------------------------------------------------
   GROUNDWORKS

   Roads are built from flat decals on a shared tarmac slab rather
   than from stacked boxes, so nothing z-fights and the whole network
   costs a handful of draw calls. Segments stop short of junctions on
   purpose: two overlapping road quads in the same plane is exactly
   the shimmering mess this replaces.
--------------------------------------------------------------- */
var ROAD_Y = 0.05, PAVE_Y = 0.30, MARK_Y = 0.10;

function road(zone,parent,x1,z1,x2,z2,width,opt){
  opt = opt||{};
  var dx=x2-x1, dz=z2-z1, len=Math.hypot(dx,dz);
  if(len<1) return;
  var ry = Math.atan2(dx,dz), mx=(x1+x2)/2, mz=(z1+z2)/2;
  decal(parent, width, len, matRough(opt.color||P.asphalt), mx, ROAD_Y, mz, -ry);

  if(opt.dashes!==false){
    var n = Math.max(1,(len/8)|0);
    for(var i=0;i<n;i++){
      var t=(i+0.5)/n;
      idec(zone, 0.35, 3.2, matRough(P.paint), x1+dx*t, MARK_Y, z1+dz*t, -ry);
    }
  }
  var pw = opt.pave===undefined ? 6 : opt.pave;
  var sides = opt.sides || [-1,1];
  for(var s=0;s<sides.length;s++){
    var sgn = sides[s];
    var kx = Math.cos(ry)*sgn*(width/2+0.35), kz = -Math.sin(ry)*sgn*(width/2+0.35);
    inst(zone, gBox(0.7,PAVE_Y+0.1,len), matStone(P.kerb), mx+kx, (PAVE_Y+0.1)/2, mz+kz, ry);
    if(pw>0){
      var px = Math.cos(ry)*sgn*(width/2+0.7+pw/2), pz = -Math.sin(ry)*sgn*(width/2+0.7+pw/2);
      var slab = bx(parent, pw, PAVE_Y, len, matStone(P.pave), mx+px, PAVE_Y/2, mz+pz, ry);
      slab.castShadow = false;
      var flags = Math.max(1,(len/22)|0);
      for(var f=1;f<flags;f++){
        if(f%2) continue;
        idec(zone, pw-0.5, 7, matStone(P.paveAlt), x1+dx*(f/flags)+px, PAVE_Y+0.02, z1+dz*(f/flags)+pz, -ry);
      }
    }
  }
}
function junction(zone,parent,x,z,size){
  decal(parent, size, size, matRough(P.asphalt), x, ROAD_Y+0.005, z);
  var c = size/2+3.4;
  for(var i=0;i<4;i++){
    var sx = (i<2?1:-1)*c, sz=(i%2?1:-1)*c;
    var pad = bx(parent, 6.4, PAVE_Y, 6.4, matStone(P.pave), x+sx, PAVE_Y/2, z+sz);
    pad.castShadow=false;
  }
}
function crossing(zone,parent,x,z,width,ry){
  for(var i=-3;i<=3;i++){
    idec(zone, 0.75, width-0.8, matRough(P.paint),
      x+Math.cos(ry)*i*1.25, MARK_Y, z-Math.sin(ry)*i*1.25, -ry);
  }
}
/* The dropped kerb where a forecourt meets a pavement, so the player
   never has to hop a lip to reach a business. */
function driveway(zone,parent,x,z,w,d,ry){
  var slab = bx(parent, w, PAVE_Y, d, matStone(P.concrete), x, PAVE_Y/2, z, ry);
  slab.castShadow=false;
}
/* Forecourt / hardstanding with a painted edge. */
function apron(zone,parent,x,z,w,d,col,ry){
  var slab = bx(parent, w, 0.22, d, matStone(col||P.concrete), x, 0.11, z, ry);
  slab.castShadow = false;
  return slab;
}
/* A raised platform with a retaining wall and a long shallow ramp, so
   the map gains height without ever becoming an obstacle course. */
function terrace(zone,parent,x,z,w,d,h,topCol,rampDir){
  bx(parent, w, h, d, matStone(P.concreteDim), x, h/2, z);
  var top = bx(parent, w+0.5, 0.3, d+0.5, matStone(topCol||P.marbleVein), x, h+0.15, z);
  top.castShadow=false;
  var run = h*5.5;
  var rx = x + Math.sin(rampDir)*(d/2+run/2), rz = z + Math.cos(rampDir)*(d/2+run/2);
  var ramp = bx(parent, 7, h+0.3, run, matStone(topCol||P.marbleVein), rx, (h+0.3)/2, rz, rampDir);
  ramp.rotation.x = Math.atan2(h, run) * (Math.cos(rampDir)>=0?1:-1);
  ramp.castShadow=false;
  return top;
}
/* A soft grass mound. Purely visual -- the player walks straight
   through it -- but it is what stops the ground reading as a sheet. */
function berm(zone,x,z,r,h,rnd){
  for(var i=1;i<=3;i++){
    var t=i/3;
    inst(zone, gSph(1,9), matRough(i===3?P.grassDry:P.grassPale),
      x, -h*0.55 + h*t*0.5, z, rnd()*6.28,
      r*(1-t*0.5), h*(0.8+t*0.3), r*(1-t*0.5)*(0.8+rnd()*0.4));
  }
}
/* An irregular patch of a different grass tone. */
function grassPatch(zone,x,z,r,col,rnd,y){
  inst(zone, gCyl(1,1,0.12,10), matRough(col), x, (y||0)+0.07, z, rnd()*6.28, r, 1, r*(0.7+rnd()*0.6));
}

/* ---------------------------------------------------------------
   SCENE
--------------------------------------------------------------- */
function initWorld(){
  var app = document.getElementById("app");
  W.scene = new THREE.Scene();
  W.scene.background = new THREE.Color(0x87b8e8);
  W.scene.fog = new THREE.FogExp2(0x87b8e8, 0.0016);
  W.cam = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.3, 3000);
  W.rend = new THREE.WebGLRenderer({antialias:true, powerPreference:"high-performance"});
  W.rend.setPixelRatio(Math.min(devicePixelRatio,2));
  W.rend.setSize(innerWidth, innerHeight);
  W.rend.shadowMap.enabled = true; W.rend.shadowMap.type = THREE.PCFSoftShadowMap;
  app.appendChild(W.rend.domElement);
  W.clock = new THREE.Clock();

  /* Sky, ground bounce and sun. The hemisphere light carries a real sky
     colour above and a grass colour below, which is what stops every
     shaded face going the same flat grey. */
  W.hemi = new THREE.HemisphereLight(0xbcd8f0, 0x4a6b3a, 0.85); W.scene.add(W.hemi);
  W.sunLight = new THREE.DirectionalLight(0xfff3d0, 0.95);
  W.sunLight.position.set(60,110,40); W.sunLight.castShadow=true;
  W.sunLight.shadow.mapSize.set(2048,2048);
  /* A tight shadow frustum that travels with the player: crisp shadows
     where you are looking, none wasted on the far side of the town. */
  var sc = W.sunLight.shadow.camera; sc.left=-72; sc.right=72; sc.top=72; sc.bottom=-72; sc.near=1; sc.far=320;
  W.sunLight.shadow.bias = -0.0006;
  W.sunLight.shadow.normalBias = 0.035;
  W.scene.add(W.sunLight); W.scene.add(W.sunLight.target);
  /* A dim, shadowless fill from the opposite side so north faces are
     readable rather than black. */
  W.fillLight = new THREE.DirectionalLight(0xa8c4e8, 0.28);
  W.fillLight.position.set(-70,50,-60);
  W.scene.add(W.fillLight);

  /* Gradient sky dome. A flat background colour is the single clearest
     tell of an unfinished 3D scene. */
  var skyGeo = new THREE.SphereGeometry(1200, 24, 16);
  var pos = skyGeo.attributes.position, colors = [];
  for(var i=0;i<pos.count;i++){
    var t = Math.max(0, Math.min(1, (pos.getY(i)/1200)*0.5+0.5));
    var c = new THREE.Color(0xbcdcf6).lerp(new THREE.Color(0x4f8fd8), Math.pow(t,0.8));
    colors.push(c.r,c.g,c.b);
  }
  skyGeo.setAttribute("color", new THREE.Float32BufferAttribute(colors,3));
  W.sky = new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({vertexColors:true, side:THREE.BackSide, fog:false, depthWrite:false}));
  W.sky.renderOrder = -1;
  W.scene.add(W.sky);

  for(var z in ZONES){ var g = new THREE.Group(); W.scene.add(g); W.zoneGroups[z]=g; }

  buildHome(); buildGrove(); buildSewer(); buildStation();
  flushInstances();
  buildPlayer();
  addEventListener("resize", onResize);
}
function onResize(){ W.cam.aspect=innerWidth/innerHeight; W.cam.updateProjectionMatrix(); W.rend.setSize(innerWidth,innerHeight); }

/* The sky dome follows the camera and takes the weather's tint, so a
   storm actually darkens the sky rather than only the fog. */
function updateSky(){
  if(!W.sky) return;
  W.sky.position.copy(W.cam.position);
  var target = W.scene.background;
  if(target && W.sky.material.color) W.sky.material.color.lerp(target, 0.06);
}

function buildPlayer(){
  var g = new THREE.Group();
  var body = box(1.5,1.9,1.0,0xffe08a,0,1.6,0); g.add(body);
  var head = box(1.35,1.25,1.2,0xf7c873,0,3.2,0); g.add(head);
  var hat  = cyl(1.0,1.05,0.42,0xf2d43b,0,3.95,0,10); g.add(hat);
  var brim = cyl(1.45,1.45,0.1,0xf2d43b,0,3.76,0,12); g.add(brim);
  var la = box(0.45,1.5,0.45,0xf7c873,-1.0,1.75,0); g.add(la); g.userData.la=la;
  var ra = box(0.45,1.5,0.45,0xf7c873, 1.0,1.75,0); g.add(ra); g.userData.ra=ra;
  var ll = box(0.55,1.5,0.55,0x33405c,-0.42,0.75,0); g.add(ll); g.userData.ll=ll;
  var rl = box(0.55,1.5,0.55,0x33405c, 0.42,0.75,0); g.add(rl); g.userData.rl=rl;
  var eye1 = box(0.18,0.22,0.08,0x221a10,-0.32,3.35,0.62); g.add(eye1);
  var eye2 = box(0.18,0.22,0.08,0x221a10, 0.32,3.35,0.62); g.add(eye2);

/* ---------------------------------------------------------------
   INTERACTION PADS

   These have to stay louder than anything decorative around them. A
   detailed map is only an improvement if the thing you can press is
   still the most obvious object on screen -- so a pad is a lit disc
   in a dark collar, with a painted ring of chevrons around it and a
   soft glow column, and nothing in the scenery is allowed to look
   like one.
--------------------------------------------------------------- */
/* The painted ring under a pad, generated once per colour. */
var PADRING = {};
function padRingMaterial(col){
  if(PADRING[col]) return PADRING[col];
  var N = 128, c = document.createElement("canvas"); c.width=N; c.height=N;
  var x = c.getContext("2d");
  var hex = "#"+("000000"+col.toString(16)).slice(-6);
  x.clearRect(0,0,N,N);
  x.strokeStyle = hex; x.globalAlpha = 0.55; x.lineWidth = N*0.055;
  x.beginPath(); x.arc(N/2,N/2,N*0.40,0,Math.PI*2); x.stroke();
  x.globalAlpha = 0.22; x.lineWidth = N*0.10;
  x.beginPath(); x.arc(N/2,N/2,N*0.30,0,Math.PI*2); x.stroke();
  x.globalAlpha = 0.75; x.fillStyle = hex;
  for(var i=0;i<6;i++){
    var a = i/6*Math.PI*2;
    x.save();
    x.translate(N/2 + Math.cos(a)*N*0.40, N/2 + Math.sin(a)*N*0.40);
    x.rotate(a + Math.PI/2);
    x.beginPath(); x.moveTo(-N*0.055,N*0.030); x.lineTo(0,-N*0.030); x.lineTo(N*0.055,N*0.030); x.closePath(); x.fill();
    x.restore();
  }
  var tex = new THREE.CanvasTexture(c);
  var m = new THREE.MeshBasicMaterial({map:tex, transparent:true, depthWrite:false});
  PADRING[col] = m; return m;
}

function addPad(zone, x, z, col, kind, data, size){
  var grp = W.zoneGroups[zone];
  var g = new THREE.Group();
  var s = size||2.6;

  var base = cyl(s, s*1.08, 0.55, col, 0,0.27,0, 20); g.add(base);
  var top  = cyl(s*0.82, s*0.82, 0.14, 0xffffff, 0,0.58,0, 20);
  top.material.color.setHex(col); top.material.emissive = new THREE.Color(col).multiplyScalar(0.35); g.add(top);

  /* Ground ring and chevrons, painted onto one quad rather than built
     from eight meshes. With eighty pads in the game that difference is
     over five hundred draw calls on its own. */
  var ringPlane = new THREE.Mesh(gPlane(1,1), padRingMaterial(col));
  ringPlane.rotation.x = -Math.PI/2;
  ringPlane.position.y = 0.04;
  ringPlane.scale.set(s*3.4, s*3.4, 1);
  g.add(ringPlane);
  /* A faint light column so a pad is findable over a parked scooter. */
  var beam = new THREE.Mesh(new THREE.CylinderGeometry(s*0.5, s*0.78, 5.2, 12, 1, true),
    new THREE.MeshBasicMaterial({color:col, transparent:true, opacity:0.10, side:THREE.DoubleSide, depthWrite:false}));
  beam.position.y = 2.8; g.add(beam);

  var sign = makeSign([{t:"…",s:34}], s*2.5, 512, 190);
  sign.position.y = 4.2; g.add(sign);
  g.position.set(x, 0, z);
  grp.add(g);
  var pad = {zone:zone, group:g, sign:sign, kind:kind, data:data||{}, x:x, z:z, base:base, top:top, hidden:false, size:s};
  W.interacts.push(pad);
  return pad;
}
function setPadVisible(p, v){ p.group.visible = v; p.hidden = !v; }

/* ===============================================================
   THE TOWN

   The street plan, written down once so the districts, the driveways
   and the set dressing all agree on where the tarmac is.

     MAIN STREET    east-west at z = +26   the home block and the square
     NUGGET AVENUE  north-south at x = +22 the spine, out to the spaceport
     MILL ROAD      east-west at z = -2    couriers east, crate yard west
     STATE ROAD     east-west at z = -56   robotics east, the capitol west

   Progression runs north. The further from Main Street a district is,
   the later it unlocks and the larger its silhouette gets: a folding
   table on a kerb at one end, a launch apron at the other.
=============================================================== */
var MAIN_Z = 26, AV_X = 22, MILL_Z = -2, STATE_Z = -56;
var MAIN_W = 16, AV_W = 13, CROSS_W = 13;

var BUILDINGS = [];

/* Where each district's two pads stand. Every business now has a
   forecourt, so the pads sit where a person would actually walk up
   rather than at a blanket offset that would bury them in a wall. */
var PADOFF = [
  {w:[0,9],    s:[9,9]},      // Curb Stand
  {w:[0,9],    s:[9.5,9]},    // ZipZest Couriers
  {w:[0,9],    s:[10,9]},     // Crate Yard
  {w:[0,9],    s:[10,9]},     // Pith Exchange
  {w:[0,9],    s:[10,9]},     // Rindworks Labs
  {w:[0,9],    s:[10,9]},     // AutoGrove Robotics
  {w:[0,13],   s:[11,13]},    // Citrus Sovereignty

function buildHome(){
  var g = W.zoneGroups.home;
  var rnd = mkRng(20260914);

  /* ---------- ground ---------- */
  var grd = new THREE.Mesh(gPlane(430,430), matRough(P.grass));
  grd.rotation.x=-Math.PI/2; grd.receiveShadow=true; g.add(grd);

  var shelter = new THREE.Group();

  shelter.position.set(-19, 0, 13);
  g.add(shelter);
  addPad("home", -15, 13, 0x6bd8a0, "travel", {}, 3.0);

  /* ---------- the manhole, set into the pavement ---------- */
  decal(g, 4.2, 4.2, matStone(P.concreteDim), -31, PAVE_Y+0.02, 14);

  addPad("home", -31, 14, 0x4a4f58, "manhole", {}, 2.2);
}

  junction("home", g, AV_X, MILL_Z, 15);

  road("home", g, 44, 35, 44, 68, 11, {pave:4});

  var lampsMain = [-150,-104,-64,-34,4,40,78,128,172];

/* ---------------------------------------------------------------
   THE COUNTRYSIDE

   Everything between the districts. Density is deliberate: thick
   woodland along the outer edge so the town has a horizon, thinning
   to open meadow in the middle distance, and almost nothing right up
   against a business so its own landscaping reads clearly.
--------------------------------------------------------------- */
function buildCountryside(g, rnd){
  var reserved = [];
  for(var i=0;i<SOURCES.length;i++) reserved.push([SOURCES[i].pos[0], SOURCES[i].pos[2], 34]);
  reserved.push([0,62,34]);   // the house
  reserved.push([1,-1,26]);   // the square
  reserved.push([-19,13,12]); // the travel hub

  function blocked(x,z,margin){
    if(Math.abs(z-MAIN_Z) < MAIN_W/2+7+margin) return true;
    if(Math.abs(z-MILL_Z) < CROSS_W/2+7+margin && x>-118 && x<110) return true;
    if(Math.abs(z-STATE_Z) < CROSS_W/2+7+margin && x>-122 && x<108) return true;
    if(Math.abs(x-AV_X) < AV_W/2+7+margin && z<MAIN_Z && z>-124) return true;
    if(Math.abs(x-44) < 11+margin && z>30 && z<72) return true;
    if(Math.abs(x+48) < 11+margin && z>30 && z<76) return true;
    for(var r=0;r<reserved.length;r++){
      var dx=x-reserved[r][0], dz=z-reserved[r][1];
      if(Math.hypot(dx,dz) < reserved[r][2]+margin) return true;
    }
    return false;
  }

  /* Woodland belt around the outside. */
  for(var t=0;t<210;t++){
    var a = rnd()*Math.PI*2, rr = 150 + rnd()*150;
    var x = Math.cos(a)*rr, z = Math.sin(a)*rr - 20;
    if(blocked(x,z,4)) continue;
    treeAt("home", x, z, 0.9+rnd()*0.8, rnd);
  }
  /* Deliberate clusters in the middle distance, never an even spread. */
  for(var c=0;c<16;c++){
    var cx = (rnd()-0.5)*270, cz = (rnd()-0.5)*250 - 20;
    if(blocked(cx,cz,26)) continue;
    berm("home", cx, cz, 9+rnd()*10, 1.4+rnd()*1.8, rnd);
    var n = 2+((rnd()*4)|0);
    for(var k=0;k<n;k++){
      var ox2 = cx+(rnd()-0.5)*18, oz2 = cz+(rnd()-0.5)*18;
      if(!blocked(ox2,oz2,4)) treeAt("home", ox2, oz2, 0.65+rnd()*0.5, rnd);
    }
    for(var b=0;b<2+((rnd()*3)|0);b++){
      var bx2 = cx+(rnd()-0.5)*22, bz2 = cz+(rnd()-0.5)*22;
      if(blocked(bx2,bz2,3)) continue;
      if(rnd()<0.55) bushAt("home", bx2, bz2, 0.9, rnd); else rockAt("home", bx2, bz2, 1, rnd);
    }
  }
  /* Grass tone variation. This does more to kill the flat-plane look
     than any number of extra props. */
  for(var p=0;p<40;p++){
    var px=(rnd()-0.5)*330, pz=(rnd()-0.5)*310-20;
    if(blocked(px,pz,1)) continue;
    grassPatch("home", px, pz, 5+rnd()*13, rnd()<0.5?P.grassDry:P.grassPale, rnd);
  }
  /* Hedgerows along the field boundaries, so the open land reads as
     farmland rather than as nothing. */
  var hedges = [[-150,-120,-150,10],[150,-130,150,20],[-120,140,-20,140],[60,150,150,150],[-160,-90,-90,-90]];
  for(var hh=0;hh<hedges.length;hh++){
    hedgeRun("home", hedges[hh][0],hedges[hh][1],hedges[hh][2],hedges[hh][3], rnd, 2.0);
  }

  /* Two depth layers of distant hills. The far ridge is paler and
     hazier, which is all it takes for the horizon to stop reading as
     a cut-out. */
  for(var i2=0;i2<26;i2++){
    var ha = i2/26*Math.PI*2 + (rnd()-0.5)*0.18;
    var hr = 300 + rnd()*90, hy = 16+rnd()*30;
    inst("home", gSph(1,10), matRough(new THREE.Color(pick(rnd,P.leaf)).lerp(new THREE.Color(0x86a8c0),0.4).getHex()),
      Math.cos(ha)*hr, -hy*0.34, Math.sin(ha)*hr-20, rnd()*6.28,
      50+rnd()*44, hy, (50+rnd()*44)*(0.8+rnd()*0.5));
  }
  for(var i3=0;i3<20;i3++){
    var fa = i3/20*Math.PI*2 + (rnd()-0.5)*0.22;
    var fr = 470 + rnd()*120, fy = 30+rnd()*48;
    inst("home", gSph(1,10), matRough(new THREE.Color(0x9ab4c8).lerp(new THREE.Color(0xc2d4e2), rnd()).getHex()),
      Math.cos(fa)*fr, -fy*0.4, Math.sin(fa)*fr-20, rnd()*6.28,
      80+rnd()*70, fy, (80+rnd()*70)*(0.8+rnd()*0.5));
  }
}

/* ===============================================================
   THE EIGHT DISTRICTS

   Each one is built to look like the business it is, and each one is
   deliberately a step up in scale and material from the last: timber
   and canvas at the kerb, profiled steel in the yards, glass and stone
   downtown, then concrete and alloy out at the pad.

   `parts.decos` holds one Group per decorative upgrade, in the order
   those upgrades appear in the shop, because that is the order the
   purchase code reveals them in.
=============================================================== */
function buildSourceBuilding(i){
  var S = SOURCES[i], g = W.zoneGroups.home;
  var grp = new THREE.Group(); grp.position.set(S.pos[0],0,S.pos[2]);
  var parts = {decos:[]}, paint = [];
  var rnd = mkRng(4001 + i*977);
  var col = S.col;

  function deco(){ var d = new THREE.Group(); d.visible=false; grp.add(d); parts.decos.push(d); return d; }

  if(i===0){
    /* ---------- THE CURB STAND ---------- */
    /* A trestle cart, crates underneath, fruit stacked unevenly on top,
       a chalkboard leaning on the leg and a striped parasol over it. */
    var counter = bx(grp, 7.2, 0.32, 3.2, matRough(P.woodPale), 0, 2.5, 0); paint.push(counter);
    bx(grp, 7.4, 0.24, 0.24, matRough(P.wood), 0, 2.28, -1.7).castShadow=false;
    for(var lg=0; lg<4; lg++){
      bx(grp, 0.26, 2.4, 0.26, matRough(P.wood), (lg<2?-3.2:3.2), 1.2, (lg%2?-1.3:1.3));
    }
    for(var cr=0; cr<3; cr++){
      bx(grp, 1.7, 1.5, 1.7, matRough(P.woodPale), -2.1+cr*2.1, 0.75, 0.5, (rnd()-0.5)*0.3);
    }
    for(var f1=0; f1<8; f1++){
      sp(grp, 0.42+rnd()*0.12, matRough(col), -2.4+f1*0.68+(rnd()-0.5)*0.12, 2.96, 0.5+(rnd()-0.5)*0.5, 8);
    }
    for(var f2=0; f2<4; f2++) sp(grp, 0.4, matRough(col), -1.1+f2*0.72, 3.66, 0.5, 8);
    var jug = cy(grp, 0.6,0.55, 1.5, matGlass(P.glass,0.4), -2.7, 3.3, -0.6, 10);
    jug.castShadow=false;
    cy(grp, 0.5,0.46, 1.0, matRough(col), -2.7, 3.1, -0.6, 10).castShadow=false;
    for(var cp=0; cp<3; cp++) cy(grp, 0.22,0.19, 0.5, matRough(P.paint), 2.0+cp*0.6, 2.9, -1.1, 7).castShadow=false;

    plaque(grp, "FRESH\nTODAY", 2.0, 2.4, -5.0, 1.6, -1.2, -0.25, P.ink, P.paintGold).rotation.x = 0.14;

    /* Parasol: stacked discs read as a canopy from every angle, where a
       ring of flat panels only worked from directly above. */
    cy(grp, 0.12,0.12, 5.0, matMetal(P.steelDark), 3.0, 2.5, 1.4, 8);
    for(var pt=0; pt<4; pt++){
      cy(grp, 2.2-pt*0.5, 2.2-pt*0.5, 0.16, matRough(pt%2? P.paint : 0xe8564f), 3.0, 4.5+pt*0.22, 1.4, 14).castShadow = pt===0;
    }
    sp(grp, 0.22, matRough(P.paintGold), 3.0, 5.5, 1.4, 8);
    bx(grp, 1.1, 0.16, 1.1, matRough(P.wood), 4.6, 1.3, -0.6).castShadow=false;
    bx(grp, 0.16, 1.3, 0.16, matRough(P.wood), 4.6, 0.65, -0.6);

    /* Purchase one: the trading permit, bolted to its own little fence. */
    var d0 = deco();
    bx(d0, 0.26, 2.6, 0.26, matRough(P.wood), -7.2, 1.3, -0.6);
    plaque(d0, "LICENSED\nTRADER", 2.6, 1.7, -7.2, 3.1, -0.6, 0, P.paint, P.ink);
    fenceRun("home", S.pos[0]-9.4, S.pos[2]-0.6, S.pos[0]-5.2, S.pos[2]-0.6, "picket", rnd);

  } else if(i===1){
    /* ---------- ZIPZEST COURIERS ---------- */
    /* A working depot: tarmac, painted bays with scooters in most of
       them, roller doors, and the parcels that are the whole point of
       the business stacked where staff would actually leave them. */
    apron("home", grp, 0, 1, 30, 26, P.asphaltWorn);
    fenceRun("home", S.pos[0]-15, S.pos[2]-12, S.pos[0]+15, S.pos[2]-12, "chain");
    fenceRun("home", S.pos[0]-15, S.pos[2]-12, S.pos[0]-15, S.pos[2]+6, "chain");
    fenceRun("home", S.pos[0]+15, S.pos[2]-12, S.pos[0]+15, S.pos[2]+6, "chain");

    var shed = bx(grp, 14, 6.4, 9, matMetal(P.steel), -3, 3.2, -5); paint.push(shed);
    var office = bx(grp, 7, 8.2, 8, matRough(0x3a5a88), 7.5, 4.1, -5); paint.push(office);
    bx(grp, 14.8, 0.5, 9.8, matMetal(P.steelDark), -3, 6.65, -5).castShadow=false;
    bx(grp, 7.8, 0.5, 8.8, matMetal(P.steelDark), 7.5, 8.55, -5).castShadow=false;
    for(var rd=0; rd<2; rd++){
      bx(grp, 4.6, 4.2, 0.2, matMetal(P.steelWarn), -7.4+rd*6.2, 2.1, -0.45).castShadow=false;
      bx(grp, 5.2, 0.4, 0.5, matMetal(P.steelDark), -7.4+rd*6.2, 4.4, -0.5).castShadow=false;
    }
    bx(grp, 1.6, 3.0, 0.2, matMetal(P.steelDark), 7.5, 1.5, -1.05).castShadow=false;
    for(var wz=0; wz<3; wz++){
      bx(grp, 1.8, 1.6, 0.14, matGlass(P.glass,0.4), 5.6+ (wz%2)*3.6, 5.6 - (wz>1?2.6:0), -1.02).castShadow=false;
    }
    plaque(grp, "ZIPZEST COURIERS", 8, 1.6, 7.5, 6.6, -0.95, 0, 0x3a5a88, P.paint);

    /* Bays: one left empty, because a full rank of identical vehicles
       is the thing that looks generated. */
