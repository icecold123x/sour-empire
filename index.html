/* ===============================================================
   THE GROVE

   A walled orchard behind a timber gate arch. Dry stone wall, gravel
   paths between raised beds, and a barn with a silo at the far end.
   It is the only place in the game with no tarmac in it at all -- the
   material change is what makes walking through the gate feel like
   leaving town rather than entering another yard.

   The 24 bed positions are unchanged: the growing code writes tree
   meshes into GROVEOBJ.trees[i].grp at exactly these coordinates.
=============================================================== */
var GROVEOBJ = {trees:[], pads:[]};
function buildGrove(){
  var g = W.zoneGroups.grove, rnd = mkRng(777);

  var grd = new THREE.Mesh(gPlane(420,420), matRough(0x77a24a));
  grd.rotation.x=-Math.PI/2; grd.receiveShadow=true; g.add(grd);
  var skirt = new THREE.Mesh(gPlane(1400,1400), matRough(0x5f8a3c));
  skirt.rotation.x=-Math.PI/2; skirt.position.y=-0.5; g.add(skirt);

  var FX = 100, FN = -58, FS = 80;   // wall extents

  /* Dry stone wall, with a gap for the gate on the south side. */
  function wallRun(x1,z1,x2,z2){
    var dx=x2-x1, dz=z2-z1, len=Math.hypot(dx,dz);
    var ry=Math.atan2(dx,dz), mx=(x1+x2)/2, mz=(z1+z2)/2;
    inst("grove", gBox(1.5,3.0,len), matStone(0xb0a892), mx, 1.5, mz, ry);
    inst("grove", gBox(2.0,0.4,len), matStone(0xc4bda8), mx, 3.2, mz, ry);
  }
  wallRun(-FX,FN,FX,FN);
  wallRun(-FX,FN,-FX,FS);
  wallRun(FX,FN,FX,FS);
  wallRun(-FX,FS,-7,FS);
  wallRun(7,FS,FX,FS);

  /* Gate arch at the head of the path. */
  bx(g, 1.8, 6, 2.2, matRough(P.wood), -7, 3, FS);
  bx(g, 1.8, 6, 2.2, matRough(P.wood),  7, 3, FS);
  bx(g, 16, 1.1, 2.6, matRough(P.wood), 0, 6.4, FS).castShadow=false;
  var gcap = cn(g, 10, 2.2, matRough(P.roofTile), 0, 8, FS, 4); gcap.rotation.y=Math.PI/4; gcap.scale.set(1,1,0.36);
  plaque(g, "THE GROVE", 9, 2.0, 0, 5.4, FS-1.5, 0, P.woodDark, P.paintGold);

  /* Gravel paths: one spine and a cross row per bank of beds. */
  var spine = bx(g, 7, 0.2, 140, matStone(P.gravel), 0, 0.1, 10); spine.castShadow=false;
  for(var pr=0; pr<4; pr++){
    var pz = -18 + pr*24 + 12;
    var cross = bx(g, 180, 0.2, 5, matStone(P.gravel), 0, 0.1, pz); cross.castShadow=false;
  }

  /* The barn, with a silo and a water butt, at the north end. */
  var barn = new THREE.Group();
  bx(barn, 15, 6.5, 10, matRough(0xb04a3a), 0, 3.25, 0);
  for(var bt=0; bt<3; bt++) bx(barn, 0.4, 6.5, 0.2, matRough(P.plaster), -5+bt*5, 3.25, 5.15).castShadow=false;
  bx(barn, 5, 4.2, 0.24, matRough(P.woodDark), 0, 2.1, 5.2).castShadow=false;
  bx(barn, 5.6, 0.3, 0.3, matMetal(P.steelDark), 0, 4.4, 5.35).castShadow=false;
  var br2 = cn(barn, 11.2, 4.2, matRough(0x7a2f26), 0, 8.6, 0, 4); br2.rotation.y=Math.PI/4; br2.scale.set(1,1,0.78);
  cy(barn, 2.6,2.6, 9, matMetal(P.steel), 9.5, 4.5, 2, 14);
  var scap = new THREE.Mesh(new THREE.SphereGeometry(2.7, 14, 8, 0, Math.PI*2, 0, Math.PI/2), matMetal(P.steelDark));
  scap.position.set(9.5, 9, 2); barn.add(scap);
  cy(barn, 1.3,1.3, 2.2, matRough(P.woodDark), -9, 1.1, 4, 12);
  cy(barn, 1.2,1.2, 0.2, matGlass(0x5f8f9c, 0.55), -9, 2.15, 4, 12).castShadow=false;
  var barrow = bx(barn, 2.2, 1.2, 1.5, matMetal(P.steelWarn), -6.5, 1.2, 6.5, 0.4);
  barrow.rotation.x = -0.4; barrow.castShadow=false;
  barn.position.set(0,0,-46); g.add(barn);

  /* Scarecrow, orchard trees along the wall, and flower borders. */
  cy(g, 0.14,0.14, 4.4, matRough(P.wood), -60, 2.2, 62, 6);
  bx(g, 3.6, 0.22, 0.22, matRough(P.wood), -60, 3.6, 62).castShadow=false;
  bx(g, 1.7, 2.0, 0.9, matRough(0xc4785a), -60, 3.2, 62).castShadow=false;
  sp(g, 1.0, matRough(0xdaba78), -60, 4.7, 62, 8);
  var orchard = [[-92,-40],[-92,10],[-92,58],[92,-44],[92,4],[92,52],[-60,-52],[60,-52]];
  for(var ot=0; ot<orchard.length; ot++) treeAt("grove", orchard[ot][0], orchard[ot][1], 0.85, rnd);
  flowerBed("grove", g, -50, FS-6, 26, 3, rnd);
  flowerBed("grove", g,  50, FS-6, 26, 3, rnd);
  for(var gp=0; gp<26; gp++){
    var gx=(rnd()-0.5)*260, gz=(rnd()-0.5)*260;
    if(Math.abs(gx)<110 && gz>-70 && gz<92) continue;
    grassPatch("grove", gx, gz, 6+rnd()*12, rnd()<0.5?0x8fb257:0x6b9440, rnd);
    if(rnd()<0.4) treeAt("grove", gx, gz, 0.9+rnd()*0.6, rnd);
  }
  /* Distant hills, so the orchard has a horizon of its own. */
  for(var hi=0; hi<18; hi++){
    var ha3 = hi/18*Math.PI*2 + (rnd()-0.5)*0.2, hr3 = 260+rnd()*80, hy3 = 14+rnd()*26;
    inst("grove", gSph(1,10), matRough(new THREE.Color(0x6b9440).lerp(new THREE.Color(0x9ab4c8), 0.45).getHex()),
      Math.cos(ha3)*hr3, -hy3*0.35, Math.sin(ha3)*hr3, rnd()*6.28, 44+rnd()*38, hy3, 44+rnd()*38);
  }

  /* 24 raised beds, timber-edged, on the original grid. */
  var idx=0;
  for(var r=0;r<4;r++) for(var c=0;c<6;c++){
    var x = -75 + c*30, z = -18 + r*24;
    var soil = bx(g, 9, 0.5, 9, matRough(P.soil), x, 0.25, z); soil.castShadow=false;
    inst("grove", gBox(10,0.7,0.5), matRough(P.wood), x, 0.35, z-4.75);
    inst("grove", gBox(10,0.7,0.5), matRough(P.wood), x, 0.35, z+4.75);
    inst("grove", gBox(0.5,0.7,10), matRough(P.wood), x-4.75, 0.35, z);
    inst("grove", gBox(0.5,0.7,10), matRough(P.wood), x+4.75, 0.35, z);
    var tg = new THREE.Group(); tg.position.set(x,0.5,z); g.add(tg);
    var pad = addPad("grove", x, z+9, 0x8fd86a, "plot", {idx:idx}, 2.2);
    GROVEOBJ.trees.push({grp:tg, idx:idx, mesh:null});
    GROVEOBJ.pads.push(pad);
    idx++;
  }
  addPad("grove", 0, -34, 0xffd166, "groveshop", {}, 3.0);
  addPad("grove", 0, FS-8, 0x6bd8a0, "travel", {}, 3.0);
}

/* ===============================================================
   THE DEEP DRAIN

   A brick storm drain rather than a corridor: brick side walls, a
   stepped barrel vault overhead, a sunken water channel down the
   middle and a raised walkway either side of it. The player walks the
   walkway; the channel is what makes the place read as somewhere
   water goes rather than a tunnel built for them.
=============================================================== */
var SEWEROBJ = {levers:[], vine:null, cage:null};
function buildSewer(){
  var g = W.zoneGroups.sewer, rnd = mkRng(313);
  var BRICK = 0x6a5248, BRICKD = 0x4e3c36, STONE = 0x6a6a64;

  /* Invert and water. */
  var inv = bx(g, 10, 0.6, 190, matRough(BRICKD), 0, -0.3, 0); inv.receiveShadow=true;
  var wat = bx(g, 9.6, 0.3, 189, matGlass(0x3a5f52, 0.7), 0, 0.15, 0); wat.castShadow=false;

  /* Walkways with a kerb onto the channel. */
  for(var sd=0; sd<2; sd++){
    var sgn = sd? 1 : -1;
    var wk = bx(g, 8, 1.1, 190, matStone(STONE), sgn*9, 0.55, 0); wk.castShadow=false;
    inst("sewer", gBox(0.5,0.4,190), matStone(0x7a7a72), sgn*5.2, 1.3, 0);
    for(var sl2=-9; sl2<=9; sl2++){
      if((sl2+sd)%3) continue;
      decal(g, 7.4, 4, matStone(0x606058), sgn*9, 1.12, sl2*9);
    }
  }
  /* Brick walls, a string course, and the springing of the vault. */
  for(var wd=0; wd<2; wd++){
    var wsg = wd? 1 : -1;
    bx(g, 2, 7, 190, matRough(BRICK), wsg*14, 3.5, 0);
    inst("sewer", gBox(2.6,0.5,190), matStone(STONE), wsg*14, 7.25, 0);
    for(var stp=1; stp<=3; stp++){
      inst("sewer", gBox(2.6,1.4,190), matRough(stp===3?BRICKD:BRICK), wsg*(14-stp*2.1), 7.7+stp*1.3, 0);
    }
  }
  bx(g, 12, 1.4, 190, matRough(BRICKD), 0, 12.3, 0);
  /* Ribs, which is what stops 190 units of brick reading as one box. */
  for(var rb2=-4; rb2<=4; rb2++){
    var rz2 = rb2*21;
    for(var rs2=0; rs2<2; rs2++){
      var rsg = rs2? 1 : -1;
      inst("sewer", gBox(0.7,7.4,1.8), matStone(STONE), rsg*13.2, 3.7, rz2);
      for(var rc=1; rc<=3; rc++) inst("sewer", gBox(2.8,0.6,1.8), matStone(STONE), rsg*(14-rc*2.1), 8.4+rc*1.3, rz2);
    }
    inst("sewer", gBox(12.4,0.6,1.8), matStone(STONE), 0, 11.9, rz2);
  }

  /* Warm gas lamps on cast-iron brackets. The tunnel used to be lit
     entirely in alien green, which flattened it and spent the one
     colour the Cosmic Vine needs to own when you finally reach it. */
  for(var lm=0; lm<10; lm++){
    var lsg = lm%2 ? 1 : -1, lz2 = -84 + lm*19;
    inst("sewer", gBox(1.4,0.2,0.2), matMetal(0x3a3632), lsg*12, 6.4, lz2);
    inst("sewer", gBox(0.9,1.2,0.9), matMetal(0x3a3632), lsg*11, 6.0, lz2);
    inst("sewer", gBox(0.55,0.75,0.55), matGlow(0xffd9a0, 1.0), lsg*11, 6.0, lz2);
    if(lm%2===0){
      var pl2 = new THREE.PointLight(0xffc98a, 0.55, 30, 2);
      pl2.position.set(lsg*11, 6, lz2); g.add(pl2);
    }
  }
  /* Shafts of daylight through street gratings: the only clue from
     down here that the town is still up there. */
  for(var sh=0; sh<3; sh++){
    var shz = [-58, 4, 62][sh];
    for(var gb=-2; gb<=2; gb++) inst("sewer", gBox(0.28,0.16,2.4), matMetal(0x3c3a36), gb*0.7, 12.9, shz);
    var beam2 = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 3.2, 12, 10, 1, true),
      new THREE.MeshBasicMaterial({color:0xdae6c8, transparent:true, opacity:0.075, side:THREE.DoubleSide, depthWrite:false}));
    beam2.position.set(0, 6.5, shz); g.add(beam2);
  }
  /* Outfalls, rubble and weed: the imperfections that say this is old. */
  for(var of2=0; of2<3; of2++){
    var ofz = [-70,-6,46][of2], ofs = of2%2 ? 1 : -1;
    var mouth = cy(g, 1.5,1.5, 1.2, matMetal(0x46423c), ofs*12.9, 3, ofz, 12);
    mouth.rotation.z = Math.PI/2; mouth.castShadow=false;
    inst("sewer", gBox(0.12,2.6,2.2), matRough(0x4a6052), ofs*12.2, 1.6, ofz);
  }
  for(var db=0; db<24; db++){
    var dsg = rnd()<0.5?-1:1, dx2 = dsg*(6+rnd()*6), dz2 = (rnd()-0.5)*160;
    if(rnd()<0.5) rockAt("sewer", dx2, dz2, 0.5, rnd, 1.1);
    else inst("sewer", gBox(1,0.08,1), matRough(0x4a6448), dx2, 1.14, dz2, rnd()*6.28, 1+rnd()*2, 1, 1+rnd()*2);
  }

  /* Levers on cast-iron pedestals, each in a painted floor ring. */
  var LCOL=[0x4a7bff,0xff4a4a,0x4aff7a,0xc07aff];
  var LNM=["BLUE","RED","GREEN","PURPLE"];
  for(var k=0;k<4;k++){
    var lx = (k%2?1:-1)*11, lz = -50 + k*26;
    var ringm = new THREE.Mesh(gCyl(3.2,3.2,0.06,20), new THREE.MeshBasicMaterial({color:LCOL[k], transparent:true, opacity:0.3}));
    ringm.position.set(lx, 1.14, lz); g.add(ringm);
    var ringi = new THREE.Mesh(gCyl(2.5,2.5,0.08,20), new THREE.MeshBasicMaterial({color:0x000000, transparent:true, opacity:0.2}));
    ringi.position.set(lx, 1.16, lz); g.add(ringi);
    bx(g, 2.2, 0.4, 2.2, matMetal(0x3a3c42), lx, 1.3, lz);
    bx(g, 1.5, 2.2, 1.5, matMetal(0x555a62), lx, 2.6, lz);
    bx(g, 1.8, 0.3, 1.8, matMetal(0x3a3c42), lx, 3.85, lz).castShadow=false;
    plaque(g, LNM[k], 1.5, 0.55, lx + (k%2?-0.9:0.9), 3.1, lz, Math.PI/2, 0x2c2e34, LCOL[k]);
    var lev = box(0.5,3.0,0.5,0x50545c, lx, 5.4, lz); g.add(lev);
    var knob = sph(0.62, LCOL[k], 0, 1.7, 0); knob.material.emissive = new THREE.Color(LCOL[k]).multiplyScalar(0.7);
    lev.add(knob);
    var pad = addPad("sewer", lx + (k%2?-3.4:3.4), lz, LCOL[k], "lever", {idx:k, name:LNM[k]}, 2.0);
    SEWEROBJ.levers.push({mesh:lev, pad:pad, idx:k, name:LNM[k], on:false});
  }

  /* The note, in a lit alcove. Without it the puzzle is guesswork, so
     it is deliberately the best-lit thing in the tunnel. */
  bx(g, 0.6, 5, 7, matRough(BRICKD), -13.4, 4, -62);
  bx(g, 0.9, 5.6, 0.7, matStone(STONE), -13.2, 4, -65.4).castShadow=false;
  bx(g, 0.9, 5.6, 0.7, matStone(STONE), -13.2, 4, -58.6).castShadow=false;
  bx(g, 1.1, 0.6, 7.6, matStone(STONE), -13.2, 6.9, -62).castShadow=false;
  bx(g, 0.2, 3.2, 5, matRough(0x5a5248), -13.0, 3.8, -62).castShadow=false;
  var noteGlow = bx(g, 0.12, 0.25, 4.6, matGlow(0xffe29e, 1), -12.8, 5.8, -62); noteGlow.castShadow=false;
  var nl2 = new THREE.PointLight(0xffdc9e, 1.0, 22, 2); nl2.position.set(-12, 5.2, -62); g.add(nl2);
  addPad("sewer", -10, -62, 0xffd166, "note", {}, 2.0);

  /* The way back up: an iron ladder in a shaft. */
  bx(g, 8, 1.4, 8, matStone(STONE), 0, 1.8, -74).castShadow=false;
  for(var lr=0; lr<2; lr++) bx(g, 0.2, 12, 0.2, matMetal(0x46423c), -0.9+lr*1.8, 8.4, -71);
  for(var rg2=0; rg2<9; rg2++) bx(g, 2.2, 0.16, 0.16, matMetal(0x46423c), 0, 3.4+rg2*1.3, -71).castShadow=false;
  addPad("sewer", 0, -74, 0x6bd8a0, "exitsewer", {}, 3.0);

  /* The sluice gate: a riveted iron plate in a stone surround with the
     winding gear above it. It is the wall the first puzzle is about,
     so it is built like something that could actually be lifted. */
  var gateGrp = new THREE.Group();
  bx(gateGrp, 2.2, 12, 2.2, matStone(STONE), -11, 6, 0);
  bx(gateGrp, 2.2, 12, 2.2, matStone(STONE),  11, 6, 0);
  bx(gateGrp, 24, 1.6, 2.6, matStone(STONE), 0, 12.6, 0).castShadow=false;
  bx(gateGrp, 20, 10, 1.0, matMetal(0x6a5a3a), 0, 5, 0);
  for(var gr3=-4; gr3<=4; gr3++) bx(gateGrp, 0.8, 10, 0.3, matMetal(0x584a30), gr3*2.1, 5, -0.65).castShadow=false;
  var wheel = cy(gateGrp, 1.9,1.9, 0.3, matMetal(0x7a6440), 0, 11.2, -1.2, 14);
  wheel.rotation.x = Math.PI/2; wheel.castShadow=false;
  gateGrp.position.set(0,0,58); g.add(gateGrp); SEWEROBJ.gate = gateGrp;

  /* Beyond the gate: a brick rotunda the vine has broken into. */
  for(var rw=0; rw<16; rw++){
    var rwa = rw/16*Math.PI*2;
    if(Math.abs(Math.cos(rwa))<0.25 && Math.sin(rwa)<0) continue;
    inst("sewer", gBox(7,12,1.6), matRough(BRICK), Math.cos(rwa)*16, 6, 74+Math.sin(rwa)*16, -rwa);
  }
  var rfl = cy(g, 17,17, 0.9, matStone(STONE), 0, 0.45, 74, 26); rfl.castShadow=false;
  for(var rv=1; rv<=3; rv++) inst("sewer", gCyl(17-rv*4.2, 17-rv*4.2, 1.4, 24), matRough(rv===3?BRICKD:BRICK), 0, 12+rv*1.2, 74);

  /* The Cosmic Vine: a real climbing plant, thick stem twisting up the
     back wall, tendrils off it, fruit clustered where the light is. */
  var vine = new THREE.Group();
  for(var vs=0; vs<12; vs++){
    var vt = vs/12, sway = Math.sin(vt*7)*1.7;
    var seg = cy(vine, 1.2-vt*0.5, 1.05-vt*0.45, 2.2, matRough(0x4e3a68), sway, 1.2+vs*1.9, 4-vt*2.4, 8);
    seg.rotation.z = Math.cos(vt*7)*0.22;
  }
  for(var vd=0; vd<8; vd++){
    var vda = rnd()*6.28, vdl = 1.6+rnd()*2.6;
    var tend = cy(vine, 0.3,0.22, vdl, matRough(0x60487e), Math.cos(vda)*2.2, 4+vd*2.4, 2+Math.sin(vda)*1.4, 6);
    tend.rotation.z = (rnd()-0.5)*1.6; tend.rotation.x = (rnd()-0.5)*1.0; tend.castShadow=false;
  }
  for(var vb=0; vb<8; vb++){
    var vba = rnd()*6.28;
    var bulb = sph(0.9+rnd()*0.6, 0xc79bff, Math.cos(vba)*(1+rnd()*3), 4+vb*2.2, 1.5+Math.sin(vba)*(1+rnd()*2.4));
    bulb.material.emissive = new THREE.Color(0xc79bff).multiplyScalar(0.55);
    vine.add(bulb);
  }
  var vlight = new THREE.PointLight(0xc79bff, 1.2, 36, 2); vlight.position.set(0,10,2); vine.add(vlight);
  vine.position.set(0,0.9,72); vine.visible=false; g.add(vine); SEWEROBJ.vine=vine;
  var vpad = addPad("sewer", 0, 66, 0xc79bff, "vine", {}, 2.6); setPadVisible(vpad,false); SEWEROBJ.vinePad=vpad;
  var kpad = addPad("sewer", 12, 40, 0xffd166, "sewerkey", {}, 2.2); setPadVisible(kpad,false); SEWEROBJ.keyPad=kpad;

  /* The cage, on a plinth off to one side of the rotunda. */
  var cage = new THREE.Group();
  bx(cage, 5, 0.6, 5, matMetal(0x4a463e), 0, 0.3, 0);
  for(var b=0;b<10;b++) cy(cage, 0.16,0.16, 5.6, matMetal(0x8e8e96), Math.cos(b/10*6.28)*2.0, 3.4, Math.sin(b/10*6.28)*2.0, 6);
  cy(cage, 2.4,2.4, 0.35, matMetal(0x6a6a72), 0, 6.3, 0, 12).castShadow=false;
  var al = sph(1.5, 0x8bf08a, 0, 2.4, 0); al.material.emissive = new THREE.Color(0x8bf08a).multiplyScalar(0.6); cage.add(al);
  var clight = new THREE.PointLight(0x8bf08a, 0.9, 22, 2); clight.position.set(0,2.4,0); cage.add(clight);
  cage.position.set(-12,0.9,76); cage.visible=false; g.add(cage); SEWEROBJ.cage=cage;
  var cpad = addPad("sewer", -12, 69, 0x8bf08a, "cage", {}, 2.2); setPadVisible(cpad,false); SEWEROBJ.cagePad=cpad;
  var ufopad = addPad("sewer", -12, 40, 0xc0c0ff, "ufokey", {}, 2.2); setPadVisible(ufopad,false); SEWEROBJ.ufoPad=ufopad;
}

/* ===============================================================
   ORBITPEEL STATION

   Built like a structure rather than dropped like a disc: a deck on a
   truss underframe, a rim you can see the edge of, radial panelling,
   running lights, solar wings and antennae. The three build sites --
   Spire, Gateway, Reactor -- sit on it as separate, recognisable
   facilities joined by gangways.
=============================================================== */
var STATIONOBJ = {spire:[], gate:[], reactor:null};
function buildStation(){
  var g = W.zoneGroups.station, rnd = mkRng(9090);
  var HULL = 0x3a4162, HULLD = 0x282e4a, PLATE = 0x8e96b4;

  var grd = new THREE.Mesh(new THREE.CircleGeometry(58,48), matStone(HULL));
  grd.rotation.x=-Math.PI/2; grd.receiveShadow=true; g.add(grd);
  var rim = new THREE.Mesh(gTorus(58, 1.1, 40), matMetal(HULLD));
  rim.rotation.x=Math.PI/2; g.add(rim);
  var edge = new THREE.Mesh(gTorus(57, 0.35, 40), matGlow(0x78c8ff, 1.0));
  edge.rotation.x=Math.PI/2; edge.position.y=0.6; g.add(edge);

  /* Deck panelling. */
  for(var ds2=0; ds2<12; ds2++){
    inst("station", gBox(0.35,0.1,116), matMetal(HULLD), 0, 0.06, 0, ds2/12*Math.PI);
  }
  for(var dr2=0; dr2<2; dr2++){
    var rr2 = new THREE.Mesh(gTorus([22,42][dr2], 0.18, 34), matMetal(HULLD));
    rr2.rotation.x=Math.PI/2; rr2.position.y=0.06; g.add(rr2);
  }
  /* Underframe. */
  for(var sp5=0; sp5<8; sp5++){
    inst("station", gBox(1.1,1.1,112), matMetal(PLATE), 0, -2.6, 0, sp5/8*Math.PI);
    var sa = sp5/8*Math.PI*2;
    inst("station", gBox(0.8,5,0.8), matMetal(PLATE), Math.cos(sa)*46, -4.4, Math.sin(sa)*46);
  }
  cy(g, 12,14, 5, matMetal(HULLD), 0, -4, 0, 20);
  cy(g, 20,22, 1.6, matMetal(HULL), 0, 0.8, 0, 30);

  /* Handrail round the edge, with a gap at the arrival side. */
  for(var hr4=0; hr4<52; hr4++){
    var hra = hr4/52*Math.PI*2;
    if(Math.abs(hra - Math.PI*0.5) < 0.30) continue;
    var hx = Math.cos(hra)*55, hz = Math.sin(hra)*55;
    inst("station", gCyl(0.1,0.1,2.2,5), matMetal(PLATE), hx, 1.1, hz);
    inst("station", gBox(0.12,0.12,6.7), matMetal(PLATE), hx, 2.2, hz, -hra+Math.PI/2);
  }
  /* Airlock at the arrival point. */
  bx(g, 7, 3.4, 4, matMetal(HULLD), 0, 1.7, 48);
  bx(g, 7.6, 0.5, 4.6, matMetal(PLATE), 0, 3.65, 48).castShadow=false;
  var alock = bx(g, 2.6, 2.6, 0.16, matGlow(0x78c8ff, 0.8), 0, 1.5, 45.9); alock.castShadow=false;
  for(var ap2=0; ap2<4; ap2++) decal(g, 1.8, 0.5, matGlow(0x78c8ff,0.7), 0, 0.09, 42-ap2*2.6);
  /* Solar wings and antennae. */
  for(var wg=0; wg<2; wg++){
    var wsg2 = wg? 1 : -1;
    inst("station", gBox(22,0.5,0.5), matMetal(PLATE), wsg2*46, 5, -18);
    for(var pn=0; pn<3; pn++){
      var pnl = bx(g, 11, 0.24, 7, matGlass(0x2a3a6e, 0.85), wsg2*(40+pn*12), 5, -18);
      pnl.rotation.z = wsg2*0.34; pnl.castShadow=false;
      var frm = bx(g, 11.4, 0.4, 7.4, matMetal(PLATE), wsg2*(40+pn*12), 4.8, -18);
      frm.rotation.z = wsg2*0.34; frm.castShadow=false;
    }
    cy(g, 0.16,0.16, 11, matMetal(PLATE), wsg2*20, 5.5, 22, 6);
    sp(g, 0.35, matGlow(0xff5a5a, 1), wsg2*20, 11.2, 22, 6);
  }
  /* Starfield, instanced. */
  for(var st2=0; st2<300; st2++){
    inst("station", gSph(1,5), matGlow(0xffffff, 1.4),
      (rnd()-0.5)*900, 30+rnd()*300, (rnd()-0.5)*900, 0, 0.45+rnd()*0.7, 0.45+rnd()*0.7, 0.45+rnd()*0.7);
  }

  /* ---------- THE SPIRE ----------
     Fourteen landings spiralling a central mast. The mast, the
     brackets and the flights between landings are what turn a stack
     of floating slabs into a tower the player can read a route up. */
  var topY = 3 + SPIRE.length*4.2;
  cy(g, 2.2,2.2, topY+10, matMetal(HULLD), 0, (topY+10)/2, 0, 12);
  for(var mc=0; mc<4; mc++){
    var mca = mc/4*Math.PI*2+0.4;

  }
  var crown = sph(1.3, 0xffd166, 0, topY+9, 0);
  crown.material.emissive = new THREE.Color(0xffd166).multiplyScalar(0.9); g.add(crown);
  var crownL = new THREE.PointLight(0xffd9a0, 1.1, 60, 2); crownL.position.set(0, topY+9, 0); g.add(crownL);

  for(var i=0;i<SPIRE.length;i++){

    var x = Math.cos(ang)*rr, z = Math.sin(ang)*rr;
    /* Each step keeps its own material: the purchase code recolours
       them one at a time to show how far the tower has been built. */
    var step = box(11,1.4,9, 0x7a86c4, x, y, z, -ang);
    g.add(step);
    inst("station", gBox(rr-4, 0.5, 1.2), matMetal(PLATE), x*(1-(rr-4)/(2*rr)), y-0.9, z*(1-(rr-4)/(2*rr)), -ang);
    var railS = bx(g, 11, 1.6, 0.16, matMetal(PLATE), x+Math.cos(ang)*4.2, y+1.5, z+Math.sin(ang)*4.2, -ang);
    railS.castShadow=false;
    if(i < SPIRE.length-1){
      var na = (i+1)*0.62, nr = 34+(i+1)*2.2, ny = 3+(i+1)*4.2;
      var nx = Math.cos(na)*nr, nz = Math.sin(na)*nr;
      for(var td=1; td<=4; td++){
        var tt = td/5;
        inst("station", gBox(3.4,0.34,1.6), matMetal(0x6e78ae),
          x+(nx-x)*tt, y+(ny-y)*tt, z+(nz-z)*tt, -(ang+(na-ang)*tt));
      }
    }
    var pad = addPad("station", x, z, 0xffd166, "spire", {idx:i}, 2.3);
    pad.group.position.y = y+0.8;
    STATIONOBJ.spire.push({mesh:step, pad:pad});
  }

  /* ---------- GATEWAY YARD ----------
     A satellite platform bridged off the hub, so the ring is built
     somewhere rather than hanging in the sky. */
  function bridge(x1,z1,x2,z2,w){
    var dx=x2-x1, dz=z2-z1, len=Math.hypot(dx,dz), ry=Math.atan2(dx,dz);
    var deck2 = bx(g, w, 0.7, len, matMetal(HULL), (x1+x2)/2, -0.35, (z1+z2)/2, ry);
    deck2.castShadow=false;
    for(var br3=0; br3<2; br3++){
      var rl2 = bx(g, 0.16, 1.6, len, matMetal(PLATE), (x1+x2)/2+Math.cos(ry)*(br3?w/2:-w/2), 0.8, (z1+z2)/2-Math.sin(ry)*(br3?w/2:-w/2), ry);
      rl2.castShadow=false;
    }
    var n2 = Math.max(2,(len/9)|0);
    for(var tb=0; tb<=n2; tb++) inst("station", gBox(0.5,3,0.5), matMetal(PLATE), x1+dx*tb/n2, -2.2, z1+dz*tb/n2);
  }
  bridge(0,-56, 0,-80, 7);
  var gdeck = cy(g, 22,24, 1.4, matMetal(HULL), 0, -0.7, -96, 30); gdeck.receiveShadow=true;
  var grim = new THREE.Mesh(gTorus(22, 0.6, 30), matGlow(0xc79bff, 0.8));
  grim.rotation.x=Math.PI/2; grim.position.set(0,0.4,-96); g.add(grim);
  for(var gh=0; gh<26; gh++){
    var gha = gh/26*Math.PI*2;
    if(Math.abs(gha - Math.PI*0.5) < 0.4) continue;
    inst("station", gCyl(0.1,0.1,2,5), matMetal(PLATE), Math.cos(gha)*21, 1.1, -96+Math.sin(gha)*21);
  }
  var ring = new THREE.Mesh(gTorus(11,1.6,36), matMetal(0x8b5cf6));
  ring.position.set(0,12,-96); g.add(ring); STATIONOBJ.ring=ring; ring.visible=false;
  for(var rp=0; rp<3; rp++){
    inst("station", gBox(0.8,12,0.8), matMetal(PLATE), Math.cos(rp/3*6.28)*11, 6, -96+Math.sin(rp/3*6.28)*11);
  }
  for(var k2=0;k2<GATEWAY.length;k2++){
    var px = -12 + (k2%4)*8, pz = -104 + ((k2/4)|0)*9;
    decal(g, 6, 6.4, matMetal(HULLD), px, 0.12, pz);
    var pad2 = addPad("station", px, pz, 0xc79bff, "gateway", {idx:k2}, 2.2);
    pad2.group.position.y=0.1; STATIONOBJ.gate.push(pad2);
  }

  /* ---------- THE WORLD REACTOR ----------
     A containment drum with cooling fins, a caged core and heat
     exchangers. The core glows, but behind a cage rather than as a
     bare ball of light the size of a house. */
  bridge(0,-112, 0,-126, 6);
  var rdeck = cy(g, 15,16, 1.4, matMetal(HULL), 0, -0.7, -138, 24); rdeck.receiveShadow=true;
  var rrim = new THREE.Mesh(gTorus(15, 0.5, 24), matGlow(0x66e0ff, 0.8));
  rrim.rotation.x=Math.PI/2; rrim.position.set(0,0.4,-138); g.add(rrim);
  var rc = new THREE.Group();
  cy(rc, 7,8, 1.6, matMetal(HULLD), 0, 0.8, 0, 18);
  cy(rc, 4.6,4.6, 7, matMetal(0x4a5270), 0, 5.1, 0, 18);
  for(var cf=0; cf<8; cf++){
    var cfa = cf/8*Math.PI*2;
    bx(rc, 2.6, 6.4, 0.3, matMetal(PLATE), Math.cos(cfa)*3.0, 5.1, Math.sin(cfa)*3.0, -cfa).castShadow=false;
  }
  cy(rc, 5.2,5.2, 0.5, matMetal(HULLD), 0, 8.9, 0, 18).castShadow=false;
  var core = sph(2.4,0x66e0ff,0,11.4,0); core.material.emissive=new THREE.Color(0x66e0ff).multiplyScalar(0.8);
  rc.add(core); STATIONOBJ.core=core;
  for(var cc2=0; cc2<10; cc2++){
    var cca = cc2/10*Math.PI*2;
    cy(rc, 0.13,0.13, 4.6, matMetal(PLATE), Math.cos(cca)*1.5, 11.4, Math.sin(cca)*1.5, 5).castShadow=false;
  }
  cy(rc, 3.2,3.2, 0.4, matMetal(HULLD), 0, 13.9, 0, 14).castShadow=false;
  for(var ex=0; ex<2; ex++){
    var exx = ex? 4.4 : -4.4;
    cy(rc, 1.3,1.3, 8, matMetal(PLATE), exx, 5.6, ex?2.6:-2.6, 12);
    cy(rc, 1.5,1.5, 0.4, matMetal(HULLD), exx, 9.8, ex?2.6:-2.6, 12).castShadow=false;
  }
  var rlight = new THREE.PointLight(0x66e0ff, 1.0, 40, 2); rlight.position.set(0,11.4,0); rc.add(rlight);
  rc.position.set(0,0,-138); rc.visible=false; g.add(rc); STATIONOBJ.reactor=rc;
  var rpad = addPad("station", 0, -126, 0x66e0ff, "reactor", {}, 2.8); setPadVisible(rpad,false); STATIONOBJ.reactorPad=rpad;

  /* ---------- THE ASCENSION APSE ---------- */
  bridge(44,24, 52,34, 6);
  var adeck = cy(g, 13,14, 1.4, matMetal(HULL), 58, -0.7, 40, 22); adeck.receiveShadow=true;
  var arim = new THREE.Mesh(gTorus(13, 0.5, 22), matGlow(0xffd166, 0.8));
  arim.rotation.x=Math.PI/2; arim.position.set(58,0.4,40); g.add(arim);
  for(var ah2=0; ah2<20; ah2++){
    var aha = ah2/20*Math.PI*2;
    if(Math.abs(aha - Math.PI*1.25) < 0.55) continue;
    inst("station", gCyl(0.1,0.1,2,5), matMetal(PLATE), 58+Math.cos(aha)*12.4, 1.1, 40+Math.sin(aha)*12.4);
  }
  var alt = new THREE.Group();
  for(var ap3=1; ap3<=3; ap3++) cy(alt, 5.4-ap3*0.9, 5.4-ap3*0.9, 0.7, matStone(0x6a5a8a), 0, ap3*0.7-0.35, 0, 14);
  for(var pil=0; pil<6; pil++){
    var pa = pil/6*Math.PI*2;
    cy(alt, 0.3,0.3, 4.4, matStone(0x8a7aaa), Math.cos(pa)*4.6, 2.2, Math.sin(pa)*4.6, 8);
  }
  var ob = new THREE.Mesh(new THREE.OctahedronGeometry(2.2), matGlow(0xffd166, 0.75));
  ob.position.y=5.6; alt.add(ob); STATIONOBJ.orb=ob;
  var aL = new THREE.PointLight(0xffd9a0, 1.1, 44, 2); aL.position.set(0,5.6,0); alt.add(aL);
  alt.position.set(58,0,40); g.add(alt);
  addPad("station", 50, 40, 0xffd166, "ascend", {}, 3.0);

  addPad("station", 0, 42, 0x6bd8a0, "travel", {}, 3.0);
}

(function setupTouch(){
  var jz = document.getElementById("joyzone"), nub = document.getElementById("joynub");
  if(!("ontouchstart" in window)) return;
  jz.style.display="block";
  var id=null, cx=0, cy=0;
  jz.addEventListener("touchstart", function(e){ var t=e.changedTouches[0]; id=t.identifier; var r=jz.getBoundingClientRect(); cx=r.left+r.width/2; cy=r.top+r.height/2; W.joy.on=true; e.preventDefault(); },{passive:false});
  addEventListener("touchmove", function(e){
    for(var i=0;i<e.changedTouches.length;i++){ var t=e.changedTouches[i]; if(t.identifier!==id) continue;
      var dx=t.clientX-cx, dy=t.clientY-cy, d=Math.min(48, Math.hypot(dx,dy)); var a=Math.atan2(dy,dx);
      W.joy.x=Math.cos(a)*(d/48); W.joy.y=Math.sin(a)*(d/48);
      nub.style.left=(38+Math.cos(a)*d)+"px"; nub.style.top=(38+Math.sin(a)*d)+"px";
    }
  },{passive:false});
  addEventListener("touchend", function(e){
    for(var i=0;i<e.changedTouches.length;i++) if(e.changedTouches[i].identifier===id){ id=null; W.joy.x=0; W.joy.y=0; W.joy.on=false; nub.style.left="38px"; nub.style.top="38px"; }
  });
  // swipe to rotate camera on right half
  var rid=null, rx=0;
  addEventListener("touchstart", function(e){ var t=e.changedTouches[0]; if(t.clientX < innerWidth*0.45) return; if(t.target.closest(".pe")) return; rid=t.identifier; rx=t.clientX; });
  addEventListener("touchmove", function(e){ for(var i=0;i<e.changedTouches.length;i++){ var t=e.changedTouches[i]; if(t.identifier!==rid) continue; W.camYaw -= (t.clientX-rx)*0.006; rx=t.clientX; } });
  addEventListener("touchend", function(e){ for(var i=0;i<e.changedTouches.length;i++) if(e.changedTouches[i].identifier===rid) rid=null; });
})();
(function mouseLook(){

  el.addEventListener("mousedown", function(e){ down=true; lx=e.clientX; });
  addEventListener("mouseup", function(){ down=false; });

})();

function playerSpeed(){
  var lv = ST.powers.feet||0;
  return 16 * [1,1.5,2,3,4][lv];
}
function updatePlayer(dt){
  var f=0, s=0;
  if(W.keys["w"]||W.keys["arrowup"]) f+=1;
  if(W.keys["s"]||W.keys["arrowdown"]) f-=1;
  if(W.keys["a"]||W.keys["arrowleft"]) s-=1;
  if(W.keys["d"]||W.keys["arrowright"]) s+=1;
  if(W.joy.on){ s += W.joy.x; f -= W.joy.y; }
  var len = Math.hypot(f,s); if(len>1){ f/=len; s/=len; }
  var sp = playerSpeed();
  var cosY=Math.cos(W.camYaw), sinY=Math.sin(W.camYaw);
  var vx = (-s*cosY + f*sinY)*sp, vz = (s*sinY + f*cosY)*sp;
  var p = W.player.position;
  p.x += vx*dt; p.z += vz*dt;
  var lim = ST.zone==="sewer" ? 17 : 190;
  if(ST.zone==="sewer"){ p.x=Math.max(-lim,Math.min(lim,p.x)); p.z=Math.max(-82,Math.min(84,p.z)); }
  else { p.x=Math.max(-lim,Math.min(lim,p.x)); p.z=Math.max(-lim,Math.min(lim,p.z)); }
  var moving = (Math.abs(vx)+Math.abs(vz))>0.1;
  if(moving){
    W.player.rotation.y = Math.atan2(vx,vz);
    W.bob += dt*11;
    var sw = Math.sin(W.bob)*0.7;
    W.player.userData.ll.rotation.x = sw; W.player.userData.rl.rotation.x = -sw;
    W.player.userData.la.rotation.x = -sw*0.8; W.player.userData.ra.rotation.x = sw*0.8;
    W.player.position.y = Math.abs(Math.sin(W.bob))*0.18;
  } else {
    W.bob*=0.9;
    W.player.userData.ll.rotation.x*=0.85; W.player.userData.rl.rotation.x*=0.85;
    W.player.userData.la.rotation.x*=0.85; W.player.userData.ra.rotation.x*=0.85;
    W.player.position.y *= 0.85;
  }
  // camera
  var tx = p.x + Math.sin(W.camYaw)*-W.camDist;
  var tz = p.z + Math.cos(W.camYaw)*-W.camDist;
  W.cam.position.lerp(new THREE.Vector3(tx, p.y+W.camHeight, tz), 1-Math.pow(0.0015,dt));
  W.cam.lookAt(p.x, p.y+3.2, p.z);
  W.sunLight.position.set(p.x+60, 110, p.z+40);
  W.sunLight.target.position.set(p.x,0,p.z);
  ST.pos = [p.x,p.y,p.z];
}

function setZone(z){
  ST.zone = z;
  var Z = ZONES[z];
  for(var k in W.zoneGroups) W.zoneGroups[k].visible = (k===z);
  W.player.position.set(0,0, z==="sewer"? -70 : 14);
  applyWeatherVisual();
  document.getElementById("zonelbl").textContent = Z.name;
  clearPickups();
  toast("Entered "+Z.name);
}

/* =====================  PADS / INTERACTION  ===================== */
var nearPad = null;
function updatePads(){
  var p = W.player.position, best=null, bd=1e9;
  for(var i=0;i<W.interacts.length;i++){
    var it = W.interacts[i];
    if(it.zone!==ST.zone || it.hidden) continue;
    var d = Math.hypot(p.x-it.group.position.x, p.z-it.group.position.z);
    if(d < it.size+3.2 && d<bd){ bd=d; best=it; }
    it.top.material.emissiveIntensity = 1;
    it.group.children[1].position.y = 0.58 + Math.sin(performance.now()*0.003 + i)*0.06;
  }
  nearPad = best;
  var pl = document.getElementById("promptlbl");
  if(best){ pl.classList.add("on"); pl.innerHTML = padPrompt(best); }
  else pl.classList.remove("on");
}

function tryInteract(){
  if(!nearPad) return;
  var p = nearPad;
  switch(p.kind){
    case "work": {
      var i=p.data.src;
      if(!ST.src[i].owned){ buySource(i); } else { startShift(i); }
      break; }
    case "shop": UI.openSource(p.data.src); break;
    case "travel": UI.openTravel(); break;
    case "manhole": enterSewer(); break;
    case "exitsewer": setZone("home"); break;
    case "note": UI.openNote(); break;
    case "plot": UI.openPlot(p.data.idx); break;
    case "groveshop": UI.openGrove(); break;
    case "lever": pullLever(p.data.idx); break;
    case "vine": harvestVine(); break;
    case "sewerkey": pickSewerKey(); break;
    case "ufokey": pickUfoKey(); break;
    case "cage": freeAlien(); break;
    case "spire": UI.openSpire(); break;
    case "gateway": UI.openGateway(); break;
    case "reactor": UI.openReactor(); break;
    case "ascend": UI.openReset("asc"); break;
  }
}

/* simple synth audio */
var AC=null;
function beep(freq, dur, type, vol){
  if(!ST||!ST.settings.sound) return;
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(), g=AC.createGain();
    o.type=type||"square"; o.frequency.value=freq;
    g.gain.value=(vol||0.07); o.connect(g); g.connect(AC.destination);
    var t=AC.currentTime; g.gain.setValueAtTime(g.gain.value,t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+(dur||0.12));
    o.start(t); o.stop(t+(dur||0.12)+0.02);
  }catch(e){}
}
function sfx(kind){

      p.g.parent&&p.g.parent.remove(p.g); W.pickups.splice(i,1); continue;

    if(p.t>p.life){ p.g.parent&&p.g.parent.remove(p.g); W.pickups.splice(i,1); }

function addCash(v){

  ST.earnedAscRun = bAdd(ST.earnedAscRun, v);

}
function spend(v){ if(bLt(ST.cash,v)) return false; ST.cash = bSub(ST.cash,v); return true; }

function buySource(i){
  if(!canManageNow(i)){ toast("You have to be there to buy it — or unlock <b>Long Reach</b>.","bad"); return; }
  var c = srcUnlockCost(i);
  if(!bGte(ST.cash,c)){ toast("Need "+fmtC(c), "bad"); sfx("bad"); return; }

}
function startShift(i){
  var s = ST.src[i];
  if(!s.owned) return;
  if(s.running) { return; }
  s.running = true; s.prog = 0;
  ST.stats.clicks++;

}
function doBigAction(){
  // context sensitive: nearest owned non-managed source, else nearest pad interaction
  if(nearPad && nearPad.kind==="work"){ var i=nearPad.data.src; if(!ST.src[i].owned) buySource(i); else startShift(i); return; }
  // manual-run the first non-managed owned source
  for(var i2=0;i2<SOURCES.length;i2++){ if(ST.src[i2].owned && !ST.src[i2].mgr && !ST.src[i2].running){ startShift(i2); return; } }
  if(nearPad) tryInteract();

function buyUpgrade(i,j,count){
  if(!canManageNow(i)){ toast("Too far away. Walk to "+SOURCES[i].name+", or unlock <b>Oversight</b> in Powers.","bad"); return false; }
  var u = SOURCES[i].ups[j], s = ST.src[i];
  var mx = maxLevel(u);
  var want = count===undefined ? bulkAmount() : count;
  var bought = 0, spent = B0();
  while(bought < want && s.lv[j] < mx){
    var c = upCost(i,j,s.lv[j]);
    if(!bGte(ST.cash,c)) break;
    spend(c); s.lv[j]++; bought++; spent=bAdd(spent,c);
  }
  if(bought===0){ toast("Can't afford "+u.name+" — "+fmtC(upCost(i,j,s.lv[j])), "bad"); sfx("bad"); return false; }
  sfx("buy");
  if(u.kind==="manager"){ s.mgr=true; banner("MANAGER HIRED — "+SOURCES[i].name); toast("<b>"+u.name+"</b> now runs "+SOURCES[i].name+" automatically, even offline.","gold"); sfx("big"); }
  else if(u.kind==="deco"){ applyDecos(); toast("<b>"+u.name+"</b> built. "+(u.deco||""),"good"); }
  else if(u.kind==="game"){ toast("<b>"+u.name+"</b> unlocked! Find it in the Empire panel.","gold"); sfx("big"); }
  else if(u.kind==="global"){ toast("<b>"+u.name+"</b> — ×"+u.val+" to ALL income.","gold"); sfx("big"); }
  else floater("−"+fmtC(spent), "#ff9c9c");
  checkUnlocks(); UI.refresh();
  return true;
}
function applyDecos(){
  for(var i=0;i<BUILDINGS.length;i++){
    var b=BUILDINGS[i], di=0;
    for(var j=0;j<SOURCES[i].ups.length;j++){
      if(SOURCES[i].ups[j].kind!=="deco") continue;
      if(b.parts.decos[di]) b.parts.decos[di].visible = ST.src[i].lv[j]>0;
      di++;
    }
  }
  if(STATIONOBJ.ring) STATIONOBJ.ring.visible = ST.gateway>=1;
  if(STATIONOBJ.reactor) STATIONOBJ.reactor.visible = ST.gateway>=7;
  if(STATIONOBJ.reactorPad) setPadVisible(STATIONOBJ.reactorPad, ST.gateway>=7);

/* =====================  PRODUCTION TICK  ===================== */
function produce(dt){
  for(var i=0;i<SOURCES.length;i++){
    var s = ST.src[i]; if(!s.owned) continue;
    if(!s.running && !s.mgr) continue;
    var cyc = srcCycle(i);
    if(s.mgr){
      // continuous: pays payout/cycle per second, no matter how small the cycle gets
      addCash(bMulN(bDivN(srcPayout(i), cyc), dt));
      s.prog = (s.prog + dt/Math.max(cyc,0.08)) % 1;
      continue;
    }
    var vis = Math.max(cyc, 0.12);
    s.prog += dt/vis;
    if(s.prog >= 1){
      s.prog = 0; s.running = false;
      var pay = srcPayout(i);
      addCash(pay);
      floater("+"+fmtC(pay));
    }
  }
}

/* =====================  OFFLINE  ===================== */
function offlineEarnings(seconds){
  var rate = totalRate();
  if(bIsZero(rate) || seconds < 20) return null;
  var capped = Math.min(seconds, 60*60*24*3);
  var gain = bMulN(rate, capped);
  var per = [];
  for(var i=0;i<SOURCES.length;i++){ var r=srcRate(i); if(!bIsZero(r)) per.push({n:SOURCES[i].name, v:bMulN(r,capped)}); }
  return {gain:gain, secs:capped, per:per};
}

function seqMatch(seq, target){
  if(seq.length < target.length) return false;
  var tail = seq.slice(seq.length-target.length);
  for(var i=0;i<target.length;i++) if(tail[i]!==target[i]) return false;
  return true;
}

/* =====================  THE GROVE  ===================== */
function groveUnlockCost(){ return B(1e12); }
function plotCost(n){ return B(60*Math.pow(1.8,n)); }
function mutLuck(){
  var m = 1 + 0.3*cshop("luck");
  m *= groveBuffMult("luck")||1;
  return m;
}
function rollMutations(plot){
  var out=[], n = 1 + (plot.f_uran?2:0) + (plot.pendingMyst?2:0);
  if(Math.random()<0.45) n++;
  if(Math.random()<0.18*mutLuck()) n++;
  var lucky = plot.f_clov?2:1;
  for(var i=0;i<n;i++){
    var good = Math.random() < (0.62 + 0.08*Math.log10(mutLuck()*lucky+1));
    if(i===0 && plot.f_asc) good = true;
    var pool = MUTS.filter(function(m){ return !!m.good === good; });
    // rarer (later in array) mutations weighted by luck
    var idx;
    if(good){ var r=Math.random()/(lucky*mutLuck()*0.7+0.3); idx = Math.min(pool.length-1, Math.floor(Math.pow(r,1.7)*pool.length)); idx = pool.length-1-idx; }
    else idx = Math.floor(Math.random()*pool.length);
    var nm = pool[idx].n;
    if(out.indexOf(nm)<0) out.push(nm);
  }
  plot.pendingMyst=false;
  return out;
}
function plotStats(p){
  var st = {cash:1, spd:1, val:1, grow:1, luck:1};
  if(!p||!p.muts) return st;
  var counts = {};
  for(var i=0;i<p.muts.length;i++){ counts[p.muts[i]]=(counts[p.muts[i]]||0)+1; }
  for(var nm in counts){
    var m = MUTS.filter(function(x){return x.n===nm;})[0]; if(!m) continue;
    var c = counts[nm];
    ["cash","spd","val","grow","luck"].forEach(function(k){ if(m[k]) st[k] *= Math.pow(m[k], c); });
  }
  return st;
}
function plotStars(p){
  if(!p||!p.muts) return 0;
  var s = plotStats(p);
  var score = Math.log10(Math.max(1.01, s.cash*s.val*s.spd)) / Math.log10(1.6);
  var neg = p.muts.filter(function(n){ var m=MUTS.filter(function(x){return x.n===n;})[0]; return m&&!m.good; }).length;
  return Math.max(1, Math.min(10, Math.round(score - neg*1.2)));
}
function growTime(p){
  var seed = SEEDS[p.seed];
  var t = seed.grow;
  t /= (p.mGrow||1);
  var st = plotStats(p); t *= st.grow;
  if(ST.weather==="rain") t /= 2;
  t /= (groveBuffMult("grow")||1);
  return Math.max(2, t);
}
function plantSeed(idx, seedId){
  var p = ST.grove.plots[idx];
  var cost = SEEDS[seedId].cost;
  if(ST.tokens < cost){ toast("Need "+fmtInt(cost)+" Grove Tokens","bad"); return; }
  ST.tokens -= cost;
  var keep = {mGrow:p?p.mGrow:1, f_uran:p?p.f_uran:0, f_clov:p?p.f_clov:0, f_asc:p?p.f_asc:0, pendingMyst:p?p.pendingMyst:false};
  var np = {seed:seedId, t:0, ripe:false, muts:[], mGrow:keep.mGrow||1, f_uran:keep.f_uran, f_clov:keep.f_clov, f_asc:keep.f_asc, pendingMyst:keep.pendingMyst, stars:0};
  np.muts = rollMutations(np);
  np.stars = plotStars(np);
  ST.grove.plots[idx]=np; ST.grove.lastSeed=seedId;
  sfx("buy");
  if(np.stars>=9) toast("★"+np.stars+" tree! "+np.muts.join(", "),"gold");
  buildGroveVisual(idx);
  checkCompanions();
}
function groveTick(dt){
  if(!ST.grove.unlocked) return;
  for(var i=0;i<ST.grove.plots.length;i++){
    var p = ST.grove.plots[i]; if(!p) continue;
    if(!p.ripe){
      p.t += dt;
      if(p.t >= growTime(p)){ p.ripe=true; buildGroveVisual(i); }
    } else if(ST.grove.auto.autoharv){ harvestPlot(i, true); }
  }
  // buffs expiry
  var now=nowS();
  ST.grove.buffs = ST.grove.buffs.filter(function(b){ return b.until>now; });
}
function harvestPlot(i, auto){
  var p = ST.grove.plots[i]; if(!p||!p.ripe) return;
  var st = plotStats(p);
  var val = Math.max(1, Math.round(SEEDS[p.seed].val * st.val));
  ST.grove.held.push({seed:p.seed, muts:p.muts.slice(), val:val, stars:p.stars});
  p.ripe=false; p.t=0;
  if(!auto){ sfx("pick"); floater("🍋 harvested","#ffd166"); }
  buildGroveVisual(i);
  if(hasPower("taster")) autoEat();
  if(ST.grove.auto.autosell) sellAllFruit(true);
}
function sellAllFruit(quiet){
  var n=0, tot=0;
  for(var i=0;i<ST.grove.held.length;i++){ tot += ST.grove.held[i].val; n++; }
  if(n===0){ if(!quiet) toast("Nothing to sell.","bad"); return; }
  ST.tokens += tot; ST.grove.held.length=0;
  if(!quiet){ sfx("sell"); toast("Sold "+n+" fruit for <b>"+fmtInt(tot)+"</b> Grove Tokens.","good"); }
}
function eatFruit(i){
  var f = ST.grove.held[i]; if(!f) return;
  var st = plotStats(f);
  var dur = 60;
  ST.grove.buffs.push({until:nowS()+dur, cash:st.cash, spd:st.spd, grow:1/Math.max(0.1,st.grow), luck:st.luck});
  ST.grove.held.splice(i,1);
  sfx("sell");
  toast("Ate a "+SEEDS[f.seed].n+": ×"+st.cash.toFixed(2)+" cash, ×"+st.spd.toFixed(2)+" speed for 60s.","gold");
}
function autoEat(){
  while(ST.grove.held.length>0){
    var best=0;
    for(var i=1;i<ST.grove.held.length;i++) if(plotStats(ST.grove.held[i]).cash > plotStats(ST.grove.held[best]).cash) best=i;
    if(plotStats(ST.grove.held[best]).cash > 1.2) eatFruit(best);
    else break;
  }
  if(ST.grove.auto.autosell) sellAllFruit(true);
}
function buildGroveVisual(i){
  var t = GROVEOBJ.trees[i]; if(!t) return;
  while(t.grp.children.length) t.grp.remove(t.grp.children[0]);
  var p = ST.grove.plots[i];
  if(!p) return;
  var pr = Math.min(1, p.t/growTime(p));
  var h = 2 + pr*7;
  t.grp.add(cyl(0.6,0.8,h,0x6b4a2f,0,h/2,0,8));
  var fr = FRUITS[SEEDS[p.seed].f];
  var crown = sph(1.4+pr*2.6, 0x3e9b3a, 0, h+1.5, 0); t.grp.add(crown);
  if(p.ripe){
    for(var k=0;k<5;k++){
      var a=k/5*6.28;
      var f2 = sph(0.55, fr.col, Math.cos(a)*2.6, h+1.3, Math.sin(a)*2.6);
      if(FRUITS[SEEDS[p.seed].f].glow) f2.material.emissive=new THREE.Color(fr.col).multiplyScalar(0.5);
      t.grp.add(f2);
    }
  }
}

/* A custom colour scheme repaints only the surfaces each district
   nominated as paintable -- its walls, its vehicles, its flags. The
   old version walked the whole group and recoloured everything it
   found, which with shared materials would repaint the roads, the
   glass and every other building using the same palette entry. */
function applyPaint(){
  if(!ST.paint) return;
  for(var i=0;i<BUILDINGS.length;i++){
    var p = ST.paint[i]; if(p===undefined||p===0||!PALETTES[p]||!PALETTES[p].c) continue;
    var col = PALETTES[p].c;
    var list = BUILDINGS[i].parts && BUILDINGS[i].parts.paint;
    if(!list || !list.length) continue;
    for(var k=0;k<list.length;k++){
      var m = list[k];
      if(!m.userData.ownMaterial){ m.material = m.material.clone(); m.userData.ownMaterial = true; }
      m.material.color.setHex(col);
    }
  }
}

function currentObjective(){
  for(var i=0;i<SOURCES.length;i++){
    var s=ST.src[i];
    if(!s.owned){ if(i===0||ST.src[i-1].owned) return "Save "+fmtC(srcUnlockCost(i))+" to open "+SOURCES[i].name+"."; }
    if(s.owned && !s.mgr){
      for(var j=0;j<SOURCES[i].ups.length;j++) if(SOURCES[i].ups[j].kind==="manager" && s.lv[j]===0)
        return "Hire a manager for "+SOURCES[i].name+" ("+fmtC(upCost(i,j,0))+") so it runs itself.";
    }
  }
  if(canAscend()) return "The Spire is complete. Ascend at the altar on the station.";
  if(ST.src[7].owned && ST.spire<SPIRE.length) return "Build the Spire on OrbitPeel Station — step "+(ST.spire+1)+" of "+SPIRE.length+".";
  if(canEvolve()) return "You have enough Backers to Descend.";
  if(canRebirth()) return "You can Rebirth for "+fmtInt(backersFromRebirth())+" Backers.";
  return "Keep upgrading. Grab the light beams. Answer the phone.";
}

/* =====================  MAIN LOOP  ===================== */
var acc = 0, saveT = 0;
function frame(){
  requestAnimationFrame(frame);
  var dt = Math.min(0.1, W.clock.getDelta());
  ST.stats.playtime += dt;

  updatePlayer(dt);
  updatePads();
  updateFx(dt);
  updatePickups(dt);
  pickupTick(dt);
  produce(dt);
  weatherTick(dt);
  phoneTick(dt);
  groveTick(dt);
  invasionTick(dt);

  // ambient animation
  if(STATIONOBJ.orb) STATIONOBJ.orb.rotation.y += dt*0.7;
  if(STATIONOBJ.ring) STATIONOBJ.ring.rotation.z += dt*0.25;
  if(STATIONOBJ.core){ var s=1+Math.sin(performance.now()*0.002)*0.06; STATIONOBJ.core.scale.setScalar(s); }
  if(SEWEROBJ.vine) SEWEROBJ.vine.rotation.y += dt*0.4;
  updateSky();

  // pad labels
  acc += dt;
  if(acc > 0.22){ acc=0; refreshPadSigns(); updateHUD(); if(UI.cur) UI.refresh(); }
  saveT += dt; if(saveT>12){ saveT=0; save(); }
  mgNotify();

  W.rend.render(W.scene, W.cam);
}
function refreshPadSigns(){
  for(var i=0;i<W.interacts.length;i++){
    var p=W.interacts[i]; if(p.zone!==ST.zone||p.hidden) continue;
    var d=Math.hypot(W.player.position.x-p.group.position.x, W.player.position.z-p.group.position.z);
    p.sign.visible = d < 48;
    if(!p.sign.visible) continue;
    var L=null;
    switch(p.kind){
      case "work": { var s=p.data.src;
        if(!ST.src[s].owned) L=[{t:SOURCES[s].name,s:34,c:"#ffd97a"},{t:fmtC(srcUnlockCost(s)),s:38,c:bGte(ST.cash,srcUnlockCost(s))?"#7cf08a":"#ff9c9c"}];
        else L=[{t:SOURCES[s].short,s:32,c:"#ffd97a"},{t:(ST.src[s].mgr?"AUTO · ":"")+fmtC(srcPayout(s))+" / "+srcCycle(s).toFixed(2)+"s",s:28,c:"#cfe3ff"}];
        break; }
      case "shop": L=[{t:"UPGRADES",s:34,c:"#9fd8ff"},{t:SOURCES[p.data.src].short,s:26}]; break;
      case "travel": L=[{t:"TRAVEL",s:36,c:"#8df5b0"}]; break;
      case "manhole": L=[{t:"MANHOLE",s:32,c:"#bbb"}]; break;
      case "exitsewer": L=[{t:"EXIT",s:36,c:"#8df5b0"}]; break;
      case "note": L=[{t:"A NOTE",s:32,c:"#ffd97a"}]; break;
      case "plot": { var pl=ST.grove.plots[p.data.idx];
        if(p.data.idx>=ST.grove.nplots) { p.sign.visible=false; setPadVisible(p,false); continue; }
        L= pl? [{t:"PLOT "+(p.data.idx+1),s:28,c:"#ffd97a"},{t: pl.ripe?"RIPE":(Math.round(Math.min(1,pl.t/growTime(pl))*100)+"%"),s:30,c: pl.ripe?"#7cf08a":"#cfe3ff"}]
              : [{t:"PLOT "+(p.data.idx+1),s:28,c:"#ffd97a"},{t:"EMPTY",s:28,c:"#aaa"}];
        break; }
      case "groveshop": L=[{t:"SUPPLY BARN",s:30,c:"#ffd97a"},{t:fmtInt(ST.tokens)+" tokens",s:26}]; break;
      case "lever": L=[{t:p.data.name,s:34,c:"#fff"},{t:SEWEROBJ.levers[p.data.idx].on?"PULLED":"IDLE",s:26}]; break;
      case "vine": L=[{t:"COSMIC VINE",s:30,c:"#c79bff"},{t: (nowS()-ST.secrets.vine>=vineCooldown())?"READY":fmtTime(vineCooldown()-(nowS()-ST.secrets.vine)),s:26}]; break;
      case "sewerkey": L=[{t:"A KEY",s:34,c:"#ffd97a"}]; break;
      case "ufokey": L=[{t:"A STRANGE KEY",s:28,c:"#cfe3ff"}]; break;
      case "cage": L=[{t:"A CAGE",s:34,c:"#8bf08a"}]; break;
      case "spire": { var idx=p.data.idx;
        if(idx>ST.spire){ L=[{t:"STEP "+(idx+1),s:28,c:"#888"},{t:"LOCKED",s:26,c:"#888"}]; }
        else if(idx<ST.spire){ L=[{t:SPIRE[idx].n,s:24,c:"#7cf08a"},{t:"BUILT",s:26,c:"#7cf08a"}]; }
        else L=[{t:SPIRE[idx].n,s:24,c:"#ffd97a"},{t:fmtC(bMulN(B(SPIRE[idx].c),ascPriceMult())),s:26}];
        break; }
      case "gateway": { var gi=p.data.idx;
        L = gi<ST.gateway? [{t:GATEWAY[gi].n,s:24,c:"#7cf08a"},{t:"BUILT",s:24}] : [{t:GATEWAY[gi].n,s:24,c:"#c79bff"},{t:GATEWAY[gi].a+" ASCENSIONS",s:24}];
        break; }
      case "reactor": L=[{t:"WORLD REACTOR",s:26,c:"#66e0ff"},{t:Math.round(ST.charge)+" / 30000",s:26}]; break;
      case "ascend": L=[{t:"ASCENSION",s:30,c:"#ffd97a"},{t:canAscend()?"READY":"SPIRE "+ST.spire+"/"+SPIRE.length,s:26,c:canAscend()?"#7cf08a":"#ff9c9c"}]; break;
    }
    if(L) p.sign.userData.setLines(L);
  }
}

var _mgFlag={race:true,market:true};
function mgNotify(){
  ["race","market"].forEach(function(k){
    if(!hasGame(k)) return;
    var ready = mgReady(k);
    if(ready && !_mgFlag[k]){ _mgFlag[k]=true; toast("<b>"+(k==="race"?"Rind Rush":"Pith Market")+"</b> is ready to play.","gold"); }
    if(!ready) _mgFlag[k]=false;
  });
}

/* =====================  BOOT  ===================== */
function showOffline(off){
  var h = "<div class='card'><h3>⏳ You were away for "+fmtTime(off.secs)+"</h3><div class='d'>Your managers kept working the whole time.</div></div>";
  h += "<div class='card'><h3 style='color:#7cf08a;font-size:24px'>+"+fmtC(off.gain)+"</h3><div class='d'>Collected automatically.</div></div>";
  h += "<div class='tagline'>Who earned it</div>";
  off.per.forEach(function(p){ h += "<div class='card'><div class='row'><div>"+p.n+"</div><b>"+fmtC(p.v)+"</b></div></div>"; });
  h += "<div class='card'><div class='d'>Multipliers applied: global ×"+fmt(B(globalCashMult()))+" · speed ×"+fmt(B(globalSpeedMult()))+"</div></div>";
  UI.open("Welcome Back", null, function(){ return h; });
}

function init(){
  var loaded = load();
  var fresh = !loaded;
  ST = loaded || newState();
  initWorld();
  applyDecos();
  applyPaint();
  rebuildGroveVisuals();
  for(var i=0;i<W.interacts.length;i++){
    var p=W.interacts[i];
    if(p.kind==="plot" && p.data.idx>=ST.grove.nplots) setPadVisible(p,false);
  }
  setPadVisible(SEWEROBJ.keyPad, false);
  setPadVisible(SEWEROBJ.ufoPad, false);
  SEWEROBJ.vine.visible = ST.secrets.sewerKey;
  setPadVisible(SEWEROBJ.vinePad, ST.secrets.sewerKey);
  if(ST.secrets.sewerKey) SEWEROBJ.gate.visible=false;
  setPadVisible(SEWEROBJ.cagePad, false);
  setZone(ST.zone && ZONES[ST.zone] ? ST.zone : "home");
  checkCompanions();
  applyWeatherVisual();

  if(!fresh){
    var away = Math.max(0, (Date.now() - ST.t)/1000);
    var off = offlineEarnings(away);
    if(off){ addCash(off.gain); setTimeout(function(){ showOffline(off); }, 400); }
    ST.weather="clear"; ST.weatherT=0;
  } else {
    cine("SOUR EMPIRE","Your father hands you one dollar, points at the kerb, and goes back inside.\n\n\"Sell lemons,\" he says. \"Sell a LOT of lemons.\"\n\nWalk to the stand on your lawn and press E.");
  }
  W.clock.start();
  frame();
  setInterval(save, 20000);
  addEventListener("beforeunload", save);
  // periodic checks
  setInterval(function(){ checkUnlocks(); checkCompanions(); }, 3000);
}
try{ init(); }catch(e){ console.error(e); document.body.innerHTML = "<div style='padding:40px;color:#fff;font-family:sans-serif'><h2>Failed to start</h2><pre>"+e.stack+"</pre></div>"; }
</script>
